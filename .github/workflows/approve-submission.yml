name: Approve Plugin Submission

# Triggered when a maintainer adds the 'approved' label to a submission issue.
# Re-runs validation, then writes the plugin entry to data/index.json.
on:
  issues:
    types: [labeled]

# Minimal permissions: read the issue and repo contents (validation is read-only).
# Write permissions are held at job level, not workflow level (least privilege).
permissions:
  contents: read
  issues: read

jobs:
  # ── Phase 1: re-run all read-only validation checks ──────────────────────
  # Does NOT trust that Phase 2's results are still valid — state may have
  # changed since validation (e.g. a new release was cut).
  validate:
    name: Re-validate submission
    runs-on: ubuntu-latest
    # Guard: only proceed when the 'approved' label was added.
    if: github.event.label.name == 'approved'
    outputs:
      status: ${{ steps.result.outputs.status }}
      error: ${{ steps.result.outputs.error }}
      # Parsed fields passed through for the write job
      owner: ${{ steps.parse.outputs.owner }}
      repo: ${{ steps.parse.outputs.repo }}
      repo_url: ${{ steps.parse.outputs.repo_url }}
      category: ${{ steps.parse.outputs.category }}
      icon_path: ${{ steps.parse.outputs.icon_path }}
      icon_url: ${{ steps.icon-resolve.outputs.icon_url }}
      plugin_name: ${{ steps.plugin-info.outputs.plugin_name }}
      plugin_version: ${{ steps.plugin-info.outputs.plugin_version }}
      plugin_api: ${{ steps.plugin-info.outputs.plugin_api }}
      plugin_author: ${{ steps.plugin-info.outputs.plugin_author }}
      plugin_description: ${{ steps.plugin-info.outputs.plugin_description }}
      release_tag: ${{ steps.release-check.outputs.release_tag }}
      download_url: ${{ steps.release-check.outputs.download_url }}
      download_count: ${{ steps.release-check.outputs.download_count }}
      build_tier: ${{ steps.attestation.outputs.build_tier }}
      attestation_checked_at: ${{ steps.attestation.outputs.checked_at }}
      phar_found: ${{ steps.release-check.outputs.phar_found }}

    steps:
      # ── Parse issue body ───────────────────────────────────────────────────
      # Parses both Issue Form (### headers) and API/markdown formats.
      # plugin.yml-derived fields in the body are for reference only — always
      # re-fetch from the repo.
      - name: Parse submission fields from issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'PYEOF'
          import os, re

          body = os.environ.get('ISSUE_BODY', '')
          body = '\n' + body

          def get_after(header_pattern):
              """Get value after a header, handling the \n\n format used by GitHub Issue Forms."""
              m = re.search(header_pattern, body, re.IGNORECASE)
              if not m:
                  return ''
              pos = m.end()
              # Skip any blank lines
              while pos < len(body) and body[pos] in '\n\r ':
                  pos += 1
              # Collect until end of line
              end = pos
              while end < len(body) and body[end] not in '\n\r':
                  end += 1
              value = body[pos:end].strip()
              # Skip GitHub's placeholder for unanswered optional fields
              if value.startswith('_') or not value:
                  return ''
              return value

          # ── repo_url ──────────────────────────────────────────────────────
          repo_url = get_after(r'\n###\s+Repository\s+URL\s*\n\n')
          if not repo_url:
              repo_url = get_after(r'\n\*\*\s*Repository\s+URL\s*:\*\*\s*\n\n')

          if not repo_url:
              print("error=repo_url is required")
              exit(1)

          if not re.match(r'^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/?$', repo_url):
              print("error=repo_url must be https://github.com/owner/repo")
              exit(1)

          parts = repo_url.replace('https://github.com/', '').split('/')
          owner = parts[0]
          repo = parts[1].split('?')[0].strip('/')

          # ── category ───────────────────────────────────────────────────────
          category = get_after(r'\n###\s+Category\s*\n\n')

          if not category:
              print("error=category is required")
              exit(1)

          # ── icon_path ─────────────────────────────────────────────────────
          icon_path = get_after(r'\n###\s+Icon\s+Path\s*\n\n')

          # Write outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"repo_url={repo_url}\n")
              f.write(f"owner={owner}\n")
              f.write(f"repo={repo}\n")
              f.write(f"category={category}\n")
              if icon_path:
                  f.write(f"icon_path={icon_path}\n")

          print(f"Parsed: repo={owner}/{repo} category={category}")
          PYEOF

      # ── Validate category enum ─────────────────────────────────────────────
      - name: Validate category
        id: category-check
        env:
          CATEGORY: ${{ steps.parse.outputs.category }}
        run: |
          VALID_CATEGORIES="admin economy chat world protection gameplay fun api tools misc"
          if ! echo "$VALID_CATEGORIES" | grep -qE "(^| )${CATEGORY}($| )"; then
            echo "error=Invalid category '${CATEGORY}'" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ── Fetch plugin.yml ────────────────────────────────────────────────────
      - name: Fetch plugin.yml
        id: plugin-yml
        env:
          OWNER: ${{ steps.parse.outputs.owner }}
          REPO: ${{ steps.parse.outputs.repo }}
        run: |
          HTTP_CODE=$(curl -sL -o /tmp/plugin.yml -w "%{http_code}" \
            "https://api.github.com/repos/${OWNER}/${REPO}/contents/plugin.yml")

          if [ "$HTTP_CODE" = "404" ]; then
            echo "error=plugin.yml not found in the repository root" >> "$GITHUB_OUTPUT"
            exit 1
          elif [ "$HTTP_CODE" -ge "400" ]; then
            echo "error=Failed to fetch plugin.yml (HTTP $HTTP_CODE)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          CONTENT=$(cat /tmp/plugin.yml | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('content', '').replace('\n', ''))
          " 2>&1)

          if [ -z "$CONTENT" ]; then
            echo "error=plugin.yml response is missing the content field" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          PLUGIN_YAML=$(echo "$CONTENT" | base64 -d 2>/dev/null | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "plugin_yaml<<EOF" >> "$GITHUB_OUTPUT"
          echo "$PLUGIN_YAML" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          rm /tmp/plugin.yml

      # ── Parse plugin.yml fields ───────────────────────────────────────────
      - name: Parse plugin.yml fields
        id: plugin-info
        env:
          PLUGIN_YAML: ${{ steps.plugin-yml.outputs.plugin_yaml }}
        run: |
          YAML="$PLUGIN_YAML"

          get_field() {
            echo "$YAML" | sed -nE "/^${1}:[[:space:]]*/{s/^${1}:[[:space:]]*//;p}" \
                     | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          NAME=$(get_field "name")
          VERSION=$(get_field "version")
          API_FIELD=$(get_field "api")
          AUTHOR=$(get_field "author")
          AUTHORS=$(get_field "authors")
          DESCRIPTION=$(get_field "description")

          if [ -n "$AUTHOR" ]; then
            AUTHOR_LIST="$AUTHOR"
          elif [ -n "$AUTHORS" ]; then
            AUTHOR_LIST="$AUTHORS"
          else
            AUTHOR_LIST="(not specified)"
          fi

          if [ -z "$NAME" ]; then
            echo "error=plugin.yml is missing the required 'name' field" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "error=plugin.yml is missing the required 'version' field" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "plugin_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "plugin_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "plugin_api=$API_FIELD" >> "$GITHUB_OUTPUT"
          echo "plugin_author=$AUTHOR_LIST" >> "$GITHUB_OUTPUT"
          echo "plugin_description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

      # ── Fetch releases/latest and find .phar asset ───────────────────────────
      - name: Check for .phar on latest stable release
        id: release-check
        env:
          OWNER: ${{ steps.parse.outputs.owner }}
          REPO: ${{ steps.parse.outputs.repo }}
        run: |
          RAW=$(curl -sL -w '\n%{http_code}' \
            "https://api.github.com/repos/${OWNER}/${REPO}/releases/latest")
          BODY=$(echo "$RAW" | sed '$d')
          HTTP_CODE=$(echo "$RAW" | tail -n1)

          if [ "$HTTP_CODE" = "404" ]; then
            echo "error=No stable release found" >> "$GITHUB_OUTPUT"
            echo "phar_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$HTTP_CODE" -ge "400" ]; then
            echo "error=GitHub API returned HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESULT=$(echo "$BODY" | python3 -c "
          import sys, json
          release = json.load(sys.stdin)
          for asset in release.get('assets', []):
              if asset['name'].lower().endswith('.phar'):
                  print(f\"FOUND\t{release['tag_name']}\t{asset['name']}\t{asset['browser_download_url']}\t{asset['id']}\t{asset['download_count']}\")
                  sys.exit(0)
          print('NOT_FOUND')
          " 2>&1)

          if echo "$RESULT" | grep -q '^NOT_FOUND'; then
            echo "error=No .phar asset found on the latest stable release" >> "$GITHUB_OUTPUT"
            echo "phar_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_TAG=$(echo "$RESULT" | cut -f2)
          ASSET_NAME=$(echo "$RESULT" | cut -f3)
          DOWNLOAD_URL=$(echo "$RESULT" | cut -f4)
          ASSET_ID=$(echo "$RESULT" | cut -f5)
          DOWNLOAD_COUNT=$(echo "$RESULT" | cut -f6)

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "asset_id=$ASSET_ID" >> "$GITHUB_OUTPUT"
          echo "download_count=${DOWNLOAD_COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "phar_found=true" >> "$GITHUB_OUTPUT"

      # ── Check SLSA attestation ─────────────────────────────────────────────
      - name: Check SLSA attestation
        id: attestation
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ steps.parse.outputs.owner }}
          REPO: ${{ steps.parse.outputs.repo }}
          DOWNLOAD_URL: ${{ steps.release-check.outputs.download_url }}
          PHAR_FOUND: ${{ steps.release-check.outputs.phar_found }}
        run: |
          if [ "$PHAR_FOUND" != "true" ]; then
            echo "build_tier=null" >> "$GITHUB_OUTPUT"
            echo "checked_at=null" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHECKED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if ! curl -sL -o /tmp/plugin.phar "$DOWNLOAD_URL"; then
            echo "build_tier=null" >> "$GITHUB_OUTPUT"
            echo "checked_at=$CHECKED_AT" >> "$GITHUB_OUTPUT"
            rm -f /tmp/plugin.phar
            exit 0
          fi

          if gh attestation verify /tmp/plugin.phar --repo "${OWNER}/${REPO}" --format json > /tmp/attestation.json 2>&1; then
            echo "build_tier=verified" >> "$GITHUB_OUTPUT"
          else
            echo "build_tier=null" >> "$GITHUB_OUTPUT"
          fi

          echo "checked_at=$CHECKED_AT" >> "$GITHUB_OUTPUT"
          rm -f /tmp/plugin.phar

      # ── Fallback badge tier from uploader ───────────────────────────────────
      # If attestation returned null, check the asset uploader.
      - name: Determine badge tier from uploader
        id: uploader-check
        env:
          OWNER: ${{ steps.parse.outputs.owner }}
          REPO: ${{ steps.parse.outputs.repo }}
          ASSET_ID: ${{ steps.release-check.outputs.asset_id }}
          PHAR_FOUND: ${{ steps.release-check.outputs.phar_found }}
          ATTESTATION_TIER: ${{ steps.attestation.outputs.build_tier }}
        run: |
          if [ "$PHAR_FOUND" != "true" ] || [ "$ATTESTATION_TIER" = "verified" ]; then
            exit 0  # attestation already determined or no phar
          fi

          UPLOADER=$(curl -sL \
            "https://api.github.com/repos/${OWNER}/${REPO}/releases/assets/${ASSET_ID}" \
            -H "Accept: application/vnd.github+json" \
            | python3 -c "import sys, json; print(json.load(sys.stdin).get('uploader', {}).get('login', ''))" 2>/dev/null)

          if [ "$UPLOADER" = "github-actions[bot]" ]; then
            echo "build_tier=built-via-ci" >> "$GITHUB_OUTPUT"
          elif [ -n "$UPLOADER" ]; then
            echo "build_tier=unverified" >> "$GITHUB_OUTPUT"
          else
            echo "build_tier=null" >> "$GITHUB_OUTPUT"
          fi

      # ── Resolve icon_url (four-tier fallback) ────────────────────────────────
      # Tier 1: submitted icon_path → raw.githubusercontent.com/owner/repo/HEAD/<path>
      # Tier 2: icon.png convention → checked first
      # Tier 3: assets/icon.png convention → checked second
      # Tier 4: null (frontend uses DEFAULT_PLUGIN_ICON constant)
      - name: Resolve icon_url
        id: icon-resolve
        env:
          OWNER: ${{ steps.parse.outputs.owner }}
          REPO: ${{ steps.parse.outputs.repo }}
          ICON_PATH: ${{ steps.parse.outputs.icon_path }}
        run: |
          ICON_URL=""
          HEAD_BASE="https://raw.githubusercontent.com/${OWNER}/${REPO}/HEAD"

          # Tier 1: explicitly submitted icon_path
          if [ -n "$ICON_PATH" ]; then
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" \
              "${HEAD_BASE}/${ICON_PATH}")
            if [ "$HTTP_CODE" = "200" ]; then
              ICON_URL="${HEAD_BASE}/${ICON_PATH}"
            fi
          fi

          # Tier 2: icon.png (first fallback)
          if [ -z "$ICON_URL" ]; then
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" \
              "${HEAD_BASE}/icon.png")
            if [ "$HTTP_CODE" = "200" ]; then
              ICON_URL="${HEAD_BASE}/icon.png"
            fi
          fi

          # Tier 3: assets/icon.png (second fallback)
          if [ -z "$ICON_URL" ]; then
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" \
              "${HEAD_BASE}/assets/icon.png")
            if [ "$HTTP_CODE" = "200" ]; then
              ICON_URL="${HEAD_BASE}/assets/icon.png"
            fi
          fi

          # Tier 4: null — frontend uses DEFAULT_PLUGIN_ICON
          echo "icon_url=${ICON_URL:-null}" >> "$GITHUB_OUTPUT"

      # ── Determine overall validation result ───────────────────────────────────
      - name: Determine overall result
        id: result
        env:
          PARSE_ERROR: ${{ steps.parse.outputs.error }}
          PLUGIN_YML_ERROR: ${{ steps['plugin-yml'].outputs.error }}
          PLUGIN_INFO_ERROR: ${{ steps['plugin-info'].outputs.error }}
          CATEGORY_ERROR: ${{ steps['category-check'].outputs.error }}
          PHAR_ERROR: ${{ steps['release-check'].outputs.error }}
          PHAR_FOUND: ${{ steps.release-check.outputs.phar_found }}
          UPLOADER_TIER: ${{ steps['uploader-check'].outputs.build_tier }}
          ATTESTATION_TIER: ${{ steps.attestation.outputs.build_tier }}
        run: |
          # Final build tier: prefer attestation result, fall back to uploader.
          if [ "$ATTESTATION_TIER" = "verified" ]; then
            FINAL_TIER="$ATTESTATION_TIER"
          elif [ -n "$UPLOADER_TIER" ] && [ "$UPLOADER_TIER" != "null" ]; then
            FINAL_TIER="$UPLOADER_TIER"
          else
            FINAL_TIER="$ATTESTATION_TIER"
          fi
          echo "final_tier=$FINAL_TIER" >> "$GITHUB_OUTPUT"

          # Collect errors.
          ERRORS=""
          for E in "$PARSE_ERROR" "$PLUGIN_YML_ERROR" "$PLUGIN_INFO_ERROR" \
                   "$CATEGORY_ERROR" "$PHAR_ERROR"; do
            if [ -n "$E" ] && [ "$E" != "null" ]; then
              ERRORS="${ERRORS}• ${E}"$'\n'
            fi
          done

          if [ -n "$ERRORS" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "error<<EOF" >> "$GITHUB_OUTPUT"
            echo -n "$ERRORS" | sed '/^$/d' >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          elif [ "$PHAR_FOUND" != "true" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "error=No .phar asset found on the latest stable release" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

  # ── Phase 2: write to index.json if validation passed ─────────────────────
  write-index:
    name: Write to index
    needs: validate
    # Only grant write permission here — not at workflow level.
    permissions:
      contents: write
      issues: write
    # Skip if validation failed. A maintainer override path could bypass this
    # guard in the future by checking a different label.
    if: needs.validate.outputs.status == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout registry repo
        uses: actions/checkout@v4

      # ── Parse plugin.yml again in this job ──────────────────────────────
      # (No `needs` dependency on a job output since we're in a new runner.
      # Re-running the fetch is cheap and avoids needing to pass large files
      # through job outputs.)
      - name: Re-fetch plugin.yml
        id: reparse-plugin
        env:
          OWNER: ${{ needs.validate.outputs.owner }}
          REPO: ${{ needs.validate.outputs.repo }}
        run: |
          HTTP_CODE=$(curl -sL -o /tmp/plugin.yml -w "%{http_code}" \
            "https://api.github.com/repos/${OWNER}/${REPO}/contents/plugin.yml")
          if [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" -ge "400" ]; then
            echo "error=plugin.yml not found (HTTP $HTTP_CODE)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          CONTENT=$(cat /tmp/plugin.yml | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('content', '').replace('\n', ''))
          " 2>&1)

          PLUGIN_YAML=$(echo "$CONTENT" | base64 -d 2>/dev/null | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "plugin_yaml<<EOF" >> "$GITHUB_OUTPUT"
          echo "$PLUGIN_YAML" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          rm /tmp/plugin.yml

      # ── Parse author from plugin.yml ─────────────────────────────────────
      - name: Parse plugin.yml author field
        id: author
        env:
          PLUGIN_YAML: ${{ steps.reparse-plugin.outputs.plugin_yaml }}
        run: |
          YAML="$PLUGIN_YAML"
          AUTHOR=$(echo "$YAML" | sed -nE "/^author:[[:space:]]*/{s/^author:[[:space:]]*//;p}" \
                           | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          AUTHORS=$(echo "$YAML" | sed -nE "/^authors:[[:space:]]*/{s/^authors:[[:space:]]*//;p}" \
                           | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ -n "$AUTHOR" ]; then
            echo "author_list=$AUTHOR" >> "$GITHUB_OUTPUT"
          elif [ -n "$AUTHORS" ]; then
            echo "author_list=$AUTHORS" >> "$GITHUB_OUTPUT"
          else
            echo "author_list=(not specified)" >> "$GITHUB_OUTPUT"
          fi

      # ── Build and write index entry ──────────────────────────────────────
      - name: Update data/index.json
        id: write
        env:
          OWNER: ${{ needs.validate.outputs.owner }}
          REPO: ${{ needs.validate.outputs.repo }}
          REPO_URL: ${{ needs.validate.outputs.repo_url }}
          CATEGORY: ${{ needs.validate.outputs.category }}
          ICON_PATH: ${{ needs.validate.outputs.icon_path }}
          ICON_URL: ${{ needs.validate.outputs.icon_url }}
          PLUGIN_NAME: ${{ needs.validate.outputs.plugin_name }}
          PLUGIN_VERSION: ${{ needs.validate.outputs.plugin_version }}
          PLUGIN_API: ${{ needs.validate.outputs.plugin_api }}
          PLUGIN_DESCRIPTION: ${{ needs.validate.outputs.plugin_description }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          DOWNLOAD_URL: ${{ needs.validate.outputs.download_url }}
          DOWNLOAD_COUNT: ${{ needs.validate.outputs.download_count }}
          BUILD_TIER: ${{ needs.validate.outputs.build_tier }}
          ATTESTATION_CHECKED_AT: ${{ needs.validate.outputs.attestation_checked_at }}
          AUTHOR_LIST: ${{ steps.author.outputs.author_list }}
        run: |
          python3 << 'PYEOF'
          import json, os, re
          from datetime import datetime, timezone

          def env(key):
              return os.environ.get(key, '')

          def strip_wrapping_quotes(s):
              """Strip a single layer of matching quote chars some plugin.yml
              scalars carry literally (e.g. `description: "..."`)."""
              s = s.strip()
              if len(s) >= 2 and s[0] == s[-1] and s[0] in ('"', "'"):
                  s = s[1:-1]
              return s.strip()

          owner = env('OWNER')
          repo = env('REPO')

          # api field can be a multi-line YAML list ("- 5.36.0") or a single
          # scalar value.
          api_field = env('PLUGIN_API').strip()
          if api_field.startswith('-'):
              items = re.findall(r'^\s*-\s*(.+)', api_field, re.MULTILINE)
              api_list = [strip_wrapping_quotes(i) for i in items if i.strip()]
          else:
              api_list = [strip_wrapping_quotes(s) for s in api_field.split(',') if s.strip()]

          author_raw = env('AUTHOR_LIST').strip()
          if ',' in author_raw:
              author_list = [strip_wrapping_quotes(a) for a in author_raw.split(',') if a.strip()]
          elif author_raw.startswith('-'):
              items = re.findall(r'^\s*-\s*(.+)', author_raw, re.MULTILINE)
              author_list = [strip_wrapping_quotes(i) for i in items if i.strip()]
          elif author_raw and author_raw != '(not specified)':
              author_list = [strip_wrapping_quotes(author_raw)]
          else:
              author_list = []

          build_tier = env('BUILD_TIER').strip() or None
          if build_tier == 'null':
              build_tier = None

          checked_at = env('ATTESTATION_CHECKED_AT').strip()
          if checked_at in ('null', ''):
              checked_at = None

          download_count_raw = env('DOWNLOAD_COUNT').strip()
          download_count = int(download_count_raw) if download_count_raw.isdigit() else None

          icon_path = env('ICON_PATH').strip() or None
          icon_url = env('ICON_URL').strip()
          icon_url = None if icon_url in ('null', '') else icon_url

          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          entry = {
              'id': f'{owner}/{repo}',
              'name': env('PLUGIN_NAME'),
              'version': env('RELEASE_TAG').lstrip('v'),
              'api': api_list,
              'author': author_list,
              'description': strip_wrapping_quotes(env('PLUGIN_DESCRIPTION')),
              'category': env('CATEGORY'),
              'icon_path': icon_path,
              'icon_url': icon_url,
              'repo_url': env('REPO_URL'),
              'download_url': env('DOWNLOAD_URL'),
              'download_count': download_count,
              'build_tier': build_tier,
              'attestation_checked_at': checked_at,
              'approved_at': now,
              'last_synced_at': now,
          }

          print("Generated entry:")
          print(json.dumps(entry, indent=2))

          index_path = 'data/index.json'
          if os.path.exists(index_path) and os.path.getsize(index_path) > 0:
              with open(index_path) as f:
                  index = json.load(f)
          else:
              index = []

          # Replace existing entry with the same id, or append.
          ids = [i for i, e in enumerate(index) if e.get('id') == entry['id']]
          if ids:
              index[ids[0]] = entry
              action = 'updated'
          else:
              index.append(entry)
              action = 'added'

          with open(index_path, 'w') as f:
              json.dump(index, f, indent=2)
              f.write('\n')

          print(f"Index written ({len(index)} entries)")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"action={action}\n")
          PYEOF

      # ── Commit the change ─────────────────────────────────────────────────
      - name: Commit and push
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PLUGIN_NAME: ${{ needs.validate.outputs.plugin_name }}
          PLUGIN_VERSION: ${{ needs.validate.outputs.plugin_version }}
          ACTION: ${{ steps.write.outputs.action }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/index.json
          git diff --staged --quiet && {
            echo "No changes to commit — entry already exists with identical data."
            exit 0
          }

          git commit -m "Add plugin: ${PLUGIN_NAME} v${PLUGIN_VERSION}"

          # Push using GITHUB_TOKEN — actions bot can push to the repo
          # because the workflow has contents:write permission.
          git push

          echo "Committed ${ACTION} for ${PLUGIN_NAME} v${PLUGIN_VERSION}"

      # ── Post approval comment on the issue ─────────────────────────────────
      - name: Post approval comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PLUGIN_NAME: ${{ needs.validate.outputs.plugin_name }}
          PLUGIN_VERSION: ${{ needs.validate.outputs.plugin_version }}
          ACTION: ${{ steps.write.outputs.action }}
        run: |
          BODY="\
          <!-- axolotl-approval:start -->

          ## ✅ Plugin Approved

          **${PLUGIN_NAME}** v${PLUGIN_VERSION} has been $ACTION to the registry index.

          It will appear on the site shortly. You do not need to resubmit for
          future version updates — the sync workflow refreshes all plugins
          automatically every 6 hours.

          <!-- axolotl-approval:end -->
          "

          gh api --method POST \
            "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --field body="$BODY" > /dev/null

      # ── Close the issue ──────────────────────────────────────────────────
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          gh api --method PATCH \
            "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}" \
            --field state=closed \
            --field state_reason=completed \
            --silent

      # ── Lock the conversation ───────────────────────────────────────────
      - name: Lock issue conversation
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          gh api --method PUT \
            "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/lock" \
            --field lock_reason=resolved \
            --silent

      # ── Remove approved label to prevent duplicate triggers ──────────────────
      # The workflow re-triggers when any label changes, including our own removal.
      # Using a label check on re-run is sufficient to prevent infinite loops.
      - name: Remove approved label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          gh api --method DELETE \
            "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/labels/approved" \
            --silent 2>/dev/null || true

  # ── Phase 3: post failure comment if validation failed ─────────────────────
  post-failure:
    name: Post failure comment
    needs: validate
    # Only run if validation failed.
    if: needs.validate.outputs.status == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Post failure comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ERROR: ${{ needs.validate.outputs.error }}
          PHAR_FOUND: ${{ needs.validate.outputs.phar_found }}
        run: |
          # Escape error text for markdown.
          ERROR_ESCAPED=$(echo "$ERROR" | python3 -c "
          import sys, json
          print(json.dumps(sys.stdin.read().strip()))
          " 2>/dev/null || echo '\"Validation failed\"')

          BODY="\
          <!-- axolotl-approval:start -->

          ## ❌ Approval Blocked

          This submission could not be approved because validation failed:

          $ERROR

          Please address the issues above and re-open/edit this issue to
          trigger a fresh validation run.

          ---
          *This comment was posted automatically by the approval workflow.*
          <!-- axolotl-approval:end -->
          "

          gh api --method POST \
            "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --field body="$BODY" > /dev/null

          echo "Posted failure comment on issue #${ISSUE_NUMBER}"

      - name: Remove approved label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          gh api --method DELETE \
            "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/labels/approved" \
            --silent 2>/dev/null || true