name: Auto Approve Plugin Submission

# Triggered when 'approved' label is added to a PR.
# Auto-merges the PR and posts a thank you comment.
on:
  pull_request:
    types: [labeled]

# Permissions
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-approve:
    name: Auto approve submission
    runs-on: ubuntu-latest
    # Only run when 'approved' label is added
    if: github.event.label.name == 'approved'

    steps:
      # ── Check if PR is already merged ──────────────────────────────────────
      - name: Check PR status
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os

          pr_number = os.environ.get('PR_NUMBER', '')
          gh_token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')

          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
          req = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {gh_token}',
              'X-GitHub-Api-Version': '2022-11-28',
          })

          with urllib.request.urlopen(req, timeout=30) as resp:
              pr = json.loads(resp.read())
              merged = pr.get('merged', False)
              state = pr.get('state', '')
              title = pr.get('title', '')

              print(f"PR #{pr_number}: {title}")
              print(f"State: {state}, Merged: {merged}")

              # Write to output file
              with open('/tmp/pr_status.json', 'w') as f:
                  json.dump({
                      'merged': merged,
                      'state': state,
                      'title': title
                  }, f)

              # Also write to GITHUB_OUTPUT
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"merged={str(merged).lower()}\n")
                  f.write(f"state={state}\n")
                  # Extract plugin name from PR title or use repo info
                  plugin_name = title.split(':')[-1].strip() if ':' in title else title
                  f.write(f"plugin_name={plugin_name}\n")
          PYEOF

      # ── Skip if already merged ─────────────────────────────────────────────
      - name: Already merged
        if: steps.check-pr.outputs.merged == 'true'
        run: |
          echo "PR is already merged. Skipping auto-approve."
          echo "The approve-pr workflow will handle the index update."
          exit 0

      # ── Merge the PR ─────────────────────────────────────────────────────
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Merging PR #$PR_NUMBER..."

          # Use GitHub API to merge the PR
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os

          pr_number = os.environ.get('PR_NUMBER', '')
          gh_token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('REPO', '')

          # First, get PR details to check mergeable state
          pr_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
          req = urllib.request.Request(pr_url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {gh_token}',
              'X-GitHub-Api-Version': '2022-11-28',
          })

          with urllib.request.urlopen(req, timeout=30) as resp:
              pr = json.loads(resp.read())
              mergeable = pr.get('mergeable', False)
              print(f"PR mergeable: {mergeable}")

          # Merge using GitHub API
          merge_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/merge"
          merge_data = json.dumps({
              "merge_method": "merge",  # "merge", "squash", or "rebase"
              "delete_branch": True
          }).encode('utf-8')

          merge_req = urllib.request.Request(
              merge_url,
              data=merge_data,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {gh_token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='PUT'
          )

          try:
              with urllib.request.urlopen(merge_req, timeout=30) as resp:
                  result = json.loads(resp.read())
                  print(f"✓ PR merged successfully!")
                  print(f"Merge commit SHA: {result.get('sha')}")
          except urllib.error.HTTPError as e:
              error_body = json.loads(e.read())
              print(f"::error::Failed to merge PR: {error_body.get('message', str(e))}")
              exit(1)

          PYEOF

          echo "✓ PR #$PR_NUMBER merged successfully"

      # ── Post thank you comment ───────────────────────────────────────────
      - name: Post thank you comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PLUGIN_NAME: ${{ steps.check-pr.outputs.plugin_name }}
        run: |
          # Thank you comment template
          COMMENT="## 🎉 Thank you for your submission!

          Your plugin has been approved and is now being processed.

          The approval workflow will:
          - Add your plugin to the registry index
          - Make it available for download on the plugin registry

          ### What's next?
          - Your plugin will appear on the registry shortly
          - Data (version, downloads, etc.) will be automatically synced every 6 hours
          - If you'd like your plugin to be featured, let a maintainer know!

          ---
          *This comment was auto-generated by the plugin registry workflow.*"

          echo "Posting thank you comment to PR #$PR_NUMBER..."

          # Use gh CLI to post comment
          gh pr comment $PR_NUMBER --body "$COMMENT"

          echo "✓ Thank you comment posted"
