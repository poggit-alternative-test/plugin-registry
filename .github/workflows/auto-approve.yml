name: Auto Approve Plugin Submission

# Prevent concurrent runs - multiple approved labels could cause issues
concurrency:
  group: auto-approve-${{ github.repository }}
  cancel-in-progress: true

# Triggered when 'approved' label is added to a PR.
# Auto-merges the PR and posts a thank you comment.
on:
  pull_request:
    types: [labeled]

# Permissions
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-approve:
    name: Auto approve submission
    runs-on: ubuntu-latest
    # Only run when 'approved' label is added
    if: github.event.label.name == 'approved'

    steps:
      # ── Check if PR is already merged ──────────────────────────────────────
      - name: Check PR status
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os
          import base64
          import re

          pr_number = os.environ.get('PR_NUMBER', '')
          gh_token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')

          def gh_get(url):
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {gh_token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read())

          # ── Basic PR status ───────────────────────────────────────────────
          pr = gh_get(f"https://api.github.com/repos/{repo}/pulls/{pr_number}")
          merged = pr.get('merged', False)
          state = pr.get('state', '')
          title = pr.get('title', '')
          head_sha = pr.get('head', {}).get('sha', '')

          print(f"PR #{pr_number}: {title}")
          print(f"State: {state}, Merged: {merged}")

          # ── Determine plugin_name from the actual submission data, not the
          # PR title. PR titles are free text (often auto-filled by GitHub
          # from the branch/commit name, e.g. "Add ScoreHud plugin") and have
          # no guaranteed "Category: PluginName" structure, so splitting on
          # ':' silently falls back to the whole title whenever no ':' is
          # present. Instead: find the submissions/*.yaml added in this PR,
          # read its repo_url, then read plugin.yml's `name:` field from that
          # repo (same approach validate-pr.yml already uses). Fall back to
          # the GitHub repo name only if plugin.yml can't be read.
          plugin_name = title  # last-resort fallback

          try:
              files = gh_get(f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files")
              submission_file = None
              for f in files:
                  if f.get('status') == 'added' and f.get('filename', '').startswith('submissions/'):
                      if f['filename'].endswith('.yaml') or f['filename'].endswith('.yml'):
                          submission_file = f['filename']
                          break

              if submission_file:
                  ref = f"?ref={head_sha}" if head_sha else ""
                  content_data = gh_get(f"https://api.github.com/repos/{repo}/contents/{submission_file}{ref}")
                  import yaml
                  submission = yaml.safe_load(base64.b64decode(content_data['content']).decode('utf-8')) or {}
                  repo_url = submission.get('repo_url', '')

                  if repo_url:
                      parts = repo_url.replace('https://github.com/', '').split('/')
                      owner = parts[0]
                      plugin_repo = parts[1].rstrip('/') if len(parts) > 1 else ''
                      # Fallback: the repo name itself, in case plugin.yml is unreadable
                      plugin_name = plugin_repo or title

                      try:
                          yml_data = gh_get(f"https://api.github.com/repos/{owner}/{plugin_repo}/contents/plugin.yml")
                          plugin_yml = base64.b64decode(yml_data['content']).decode('utf-8')
                          name_match = re.search(r'^name:\s*(.+)$', plugin_yml, re.MULTILINE)
                          if name_match:
                              plugin_name = name_match.group(1).strip().strip('"\'')
                      except Exception as e:
                          print(f"Could not read plugin.yml, using repo name '{plugin_name}' instead: {e}")
              else:
                  print("No submission file found in PR diff, falling back to PR title for plugin_name")
          except Exception as e:
              print(f"Could not resolve plugin_name from submission data, falling back to PR title: {e}")

          print(f"Resolved plugin_name: {plugin_name}")

          # Write to output file
          with open('/tmp/pr_status.json', 'w') as f:
              json.dump({
                  'merged': merged,
                  'state': state,
                  'title': title,
                  'plugin_name': plugin_name
              }, f)

          # Also write to GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"merged={str(merged).lower()}\n")
              f.write(f"state={state}\n")
              f.write(f"plugin_name={plugin_name}\n")
          PYEOF

      # ── Persist PR context for downstream workflow_run ─────────────────────
      # workflow_run payloads may not contain pull_requests for fork-originated
      # runs. Persist the PR number before merging so approve-pr.yml can retrieve
      # it reliably from this workflow run.
      - name: Save PR context
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "${{ runner.temp }}/approve-pr-context"
          python3 - <<'PYEOF'
          import json
          import os
          from pathlib import Path

          data = {
              "pr_number": os.environ.get("PR_NUMBER", ""),
              "base_branch": os.environ.get("BASE_BRANCH", ""),
              "head_sha": os.environ.get("HEAD_SHA", ""),
          }

          path = Path(os.environ["RUNNER_TEMP"]) / "approve-pr-context" / "context.json"
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(data, indent=2))
          PYEOF

      - name: Upload PR context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approve-pr-context
          path: ${{ runner.temp }}/approve-pr-context/context.json
          retention-days: 7
          if-no-files-found: error

      # ── Skip if already merged ─────────────────────────────────────────────
      - name: Already merged
        if: steps.check-pr.outputs.merged == 'true'
        run: |
          echo "PR is already merged. Skipping auto-approve."
          echo "The approve-pr workflow will handle the index update."
          exit 0

      # ── Merge the PR ─────────────────────────────────────────────────────
      - name: Merge pull request
        if: steps.check-pr.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Merging PR #$PR_NUMBER..."

          # Use GitHub API to merge the PR
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os

          pr_number = os.environ.get('PR_NUMBER', '')
          gh_token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('REPO', '')

          # First, get PR details to check mergeable state
          pr_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
          req = urllib.request.Request(pr_url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {gh_token}',
              'X-GitHub-Api-Version': '2022-11-28',
          })

          with urllib.request.urlopen(req, timeout=30) as resp:
              pr = json.loads(resp.read())
              mergeable = pr.get('mergeable', False)
              print(f"PR mergeable: {mergeable}")

          # Merge using GitHub API - squash merge
          merge_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/merge"
          merge_data = json.dumps({
              "merge_method": "squash",  # "merge", "squash", or "rebase"
              "delete_branch": True
          }).encode('utf-8')

          merge_req = urllib.request.Request(
              merge_url,
              data=merge_data,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {gh_token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='PUT'
          )

          try:
              with urllib.request.urlopen(merge_req, timeout=30) as resp:
                  result = json.loads(resp.read())
                  print(f"✓ PR merged successfully!")
                  print(f"Merge commit SHA: {result.get('sha')}")
          except urllib.error.HTTPError as e:
              error_body = json.loads(e.read())
              print(f"::error::Failed to merge PR: {error_body.get('message', str(e))}")
              exit(1)

          PYEOF

          echo "✓ PR #$PR_NUMBER merged successfully"

      # ── Post thank you comment ───────────────────────────────────────────
      - name: Post thank you comment
        if: steps.check-pr.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PLUGIN_NAME: ${{ steps.check-pr.outputs.plugin_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os

          pr_number = os.environ.get('PR_NUMBER', '')
          gh_token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('REPO', '')
          author = os.environ.get('PR_AUTHOR', '')
          plugin_name = os.environ.get('PLUGIN_NAME', '')

          # Thank you comment template
          comment = f"""## 🎉 Thank you for your submission!

          Your plugin **"{plugin_name}"** has been approved and is now being processed.

          The approval workflow will:
          - Add your plugin to the registry index
          - Make it available for download on the plugin registry

          ### What's next?
          - Your plugin will appear on the registry shortly
          - Data (version, downloads, etc.) will be automatically synced every 6 hours
          - If you'd like your plugin to be featured, let a maintainer know!

          ---
          *This comment was auto-generated by the plugin registry workflow.*"""

          # Post comment using GitHub API
          comment_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
          comment_data = json.dumps({
              "body": comment
          }).encode('utf-8')

          req = urllib.request.Request(
              comment_url,
              data=comment_data,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {gh_token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST'
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.loads(resp.read())
                  print(f"✓ Thank you comment posted to PR #{pr_number}")
                  print(f"  Comment URL: {result.get('html_url', 'N/A')}")
          except urllib.error.HTTPError as e:
              error_body = json.loads(e.read())
              print(f"::error::Failed to post comment: {error_body.get('message', str(e))}")
              exit(1)

          PYEOF
