name: Validate Plugin Submission

# Triggered when a PR is opened, synchronized, or modified.
# Validates the submission YAML files in the submissions/ folder.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Permissions:
# - contents: read - read repo contents
# - issues: write - post comments on PR
# - security-events: write - upload security scan results
# - actions: read - access workflow info
permissions:
  contents: read
  issues: write
  security-events: write
  actions: read
  id-token: write   # Needed for OIDC verification in attestation check

jobs:
  validate:
    name: Validate submission
    runs-on: ubuntu-latest

    steps:
      # ── Checkout PR branch ──────────────────────────────────────────────────
      # Pinned to the PR's actual head commit (not the default merge ref) so
      # validation always reflects exactly what the submitter pushed, even if
      # base has moved on or the PR has a merge conflict with base.
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # ── Find submission files (NEWLY ADDED only) ─────────────────────────────
      - name: Find submission files
        id: find-files
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use GitHub API to list files changed in this PR.
          # This is more reliable than git diff because it works regardless of
          # branch fetch state and merge conflicts.

          python3 - "$PR_NUMBER" "$GITHUB_REPOSITORY" "$GH_TOKEN" << 'PYEOF'
          import sys
          import urllib.request
          import json

          pr_number = sys.argv[1]
          repo = sys.argv[2]
          gh_token = sys.argv[3]

          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files"
          req = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {gh_token}',
              'X-GitHub-Api-Version': '2022-11-28',
          })

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  files = json.loads(resp.read())
                  added = []
                  for f in files:
                      # Only count files with status 'added'
                      if f.get('status') == 'added' and f.get('filename', '').startswith('submissions/'):
                          filename = f['filename']
                          if filename.endswith('.yaml') or filename.endswith('.yml'):
                              added.append(filename)
                  # Write result to file (clean output, no debug messages)
                  with open('/tmp/added_files.txt', 'w') as out:
                      out.write('\n'.join(sorted(added)))
          except Exception as e:
              print(f"::error::Failed to fetch PR files: {e}")
              sys.exit(1)
          PYEOF

          # Read the result from file
          ADDED_FILES=$(cat /tmp/added_files.txt 2>/dev/null)

          if [ -z "$ADDED_FILES" ]; then
            echo "No new submission files added in this PR"
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found newly added submission files:"
          echo "$ADDED_FILES"

          {
            echo "files<<SUBMISSION_FILES_EOF"
            echo "$ADDED_FILES"
            echo "SUBMISSION_FILES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$ADDED_FILES" | wc -l)" >> "$GITHUB_OUTPUT"

      # ── Skip if no submission files (not a plugin submission PR) ──────────
      - name: Not a plugin submission
        if: steps.find-files.outputs.files == ''
        run: |
          echo "This PR does not contain a plugin submission."
          echo "Skipping validation - this is not a plugin submission PR."
          echo ""
          echo "To submit a plugin, add a YAML file to the submissions/ folder."
          echo "Example: submissions/owner-repo.yaml"
        # Exit 0 = success, just skip the rest

      # ── Enforce one plugin per PR ────────────────────────────────────────
      - name: Enforce one plugin per PR
        if: steps.find-files.outputs.files != ''
        run: |
          COUNT=$(echo "${{ steps.find-files.outputs.files }}" | wc -l)
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Multiple submission files detected"
            echo ""
            echo "Error: Only ONE plugin submission per PR is allowed."
            echo "Please create separate PRs for each plugin."
            echo ""
            echo "Found $COUNT files:"
            echo "${{ steps.find-files.outputs.files }}"
            exit 1
          fi
          echo "✓ Exactly one submission file found"

      # ── Validate each submission file ──────────────────────────────────────
      # Only run if submission files exist
      - name: Validate submission files
        id: validate
        if: steps.find-files.outputs.files != ''
        env:
          FILES: ${{ steps.find-files.outputs.files }}
        run: |
          set -e

          VALID_CATEGORIES="admin economy chat world protection gameplay fun api tools misc"
          ERRORS=0

          for FILE in $FILES; do
            echo ""
            echo "========================================"
            echo "Validating: $FILE"
            echo "========================================"

            # Check if file exists
            if [ ! -f "$FILE" ]; then
              echo "::error file=$FILE::File not found"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Parse YAML fields using Python
            python3 << PYEOF
          import sys
          import os
          import re
          import yaml

          FILE = os.environ.get('FILE', '$FILE')
          VALID_CATEGORIES = '$VALID_CATEGORIES'.split()

          errors = []

          try:
              with open(FILE) as f:
                  data = yaml.safe_load(f) or {}
          except yaml.YAMLError as e:
              print(f"::error file={FILE}::YAML syntax error: {e}")
              sys.exit(1)

          # ── Required: repo_url ──────────────────────────────────────────────
          repo_url = data.get('repo_url', '')
          if not repo_url:
              errors.append("repo_url is required")
          elif not re.match(r'^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/?$', repo_url):
              errors.append("repo_url must be a valid GitHub URL (https://github.com/owner/repo)")
          else:
              print(f"  repo_url: {repo_url} ✓")
              # Parse owner/repo for later use
              parts = repo_url.replace('https://github.com/', '').split('/')
              owner = parts[0]
              repo = parts[1].rstrip('/') if len(parts) > 1 else ''
              print(f"  parsed: owner={owner}, repo={repo}")

          # ── Required: category ──────────────────────────────────────────────
          category = data.get('category', '')
          if not category:
              errors.append("category is required")
          elif category not in VALID_CATEGORIES:
              errors.append(f"category must be one of: {' '.join(VALID_CATEGORIES)}")
          else:
              print(f"  category: {category} ✓")

          # ── Optional: icon_path ─────────────────────────────────────────────
          icon_path = data.get('icon_path', '')
          if icon_path:
              print(f"  icon_path: {icon_path} ✓")
          else:
              print(f"  icon_path: (not provided)")

          # ── Optional: keywords ──────────────────────────────────────────────
          keywords = data.get('keywords', [])
          if keywords:
              if not isinstance(keywords, list):
                  errors.append("keywords must be an array")
              elif len(keywords) > 10:
                  errors.append("keywords cannot have more than 10 items")
              else:
                  print(f"  keywords: {', '.join(keywords)} ✓ ({len(keywords)} items)")

          # Report errors
          if errors:
              print("")
              for err in errors:
                  print(f"::error file={FILE}::{err}")
              sys.exit(1)
          else:
              print("")
              print(f"✓ {FILE}: Validation passed")

          PYEOF

            if [ $? -ne 0 ]; then
              ERRORS=$((ERRORS + 1))
            fi
          done

          echo ""
          echo "========================================"
          if [ $ERRORS -gt 0 ]; then
            echo "Validation failed with $ERRORS error(s)"
            exit 1
          else
            echo "All files validated successfully!"
          fi

      # ── Security: Verify user has permission to the submitted repo ───────────
      # Requires real PR context (author, PR number). workflow_dispatch runs
      # have no github.event.pull_request object, so this step is skipped
      # for manual runs instead of failing on a missing PR_AUTHOR.
      - name: Verify repository permissions
        id: check-permissions
        if: steps.find-files.outputs.files != '' && github.event_name == 'pull_request'
        env:
          FILES: ${{ steps.find-files.outputs.files }}
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 << 'PYEOF'
          import os
          import urllib.request
          import json

          files = os.environ.get('FILES', '').strip()
          pr_author = os.environ.get('PR_AUTHOR', '')
          gh_token = os.environ.get('GH_TOKEN', '')

          if not files:
              print("No files to process")
              exit(0)

          if not pr_author:
              print("::error::Could not determine PR author")
              exit(1)

          print(f"PR Author: {pr_author}")
          print("="*50)

          PERMISSION_ERRORS = 0

          for filepath in files.split('\n'):
              filepath = filepath.strip()
              if not filepath:
                  continue

              print(f"\nChecking permissions for: {filepath}")

              try:
                  import yaml
                  with open(filepath) as f:
                      data = yaml.safe_load(f) or {}
              except Exception as e:
                  print(f"::error file={filepath}::Failed to read YAML: {e}")
                  PERMISSION_ERRORS += 1
                  continue

              repo_url = data.get('repo_url', '')
              if not repo_url:
                  continue

              parts = repo_url.replace('https://github.com/', '').split('/')
              owner = parts[0]
              repo = parts[1].rstrip('/') if len(parts) > 1 else ''

              print(f"  Repository: {owner}/{repo}")

              # ── Check if this is a fork ──────────────────────────────────────
              repo_info_url = f"https://api.github.com/repos/{owner}/{repo}"
              req = urllib.request.Request(repo_info_url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {gh_token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              })

              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      repo_info = json.loads(resp.read())
                      is_fork = repo_info.get('fork', False)
                      parent = repo_info.get('parent')
                      source_repo = repo_info.get('source', {})
              except urllib.error.HTTPError as e:
                  print(f"  ✗ Could not fetch repository info (HTTP {e.code})")
                  print(f"::error file={filepath}::Failed to fetch repository information")
                  PERMISSION_ERRORS += 1
                  continue
              except Exception as e:
                  print(f"  ✗ Error: {e}")
                  print(f"::error file={filepath}::Failed to fetch repository information")
                  PERMISSION_ERRORS += 1
                  continue

              if is_fork and parent:
                  parent_full_name = parent.get('full_name', '')
                  print(f"  ⚠️  This is a fork of: {parent_full_name}")
                  print(f"  Checking if original is already in registry...")

                  # Check if original repo is in the index
                  index_path = 'data/index.json'
                  original_in_registry = False
                  if os.path.exists(index_path):
                      with open(index_path) as f:
                          index = json.load(f)
                          for entry in index:
                              entry_id = entry.get('id', '')
                              # Check both parent and source (for forks of forks)
                              if entry_id == parent_full_name or (source_repo and entry_id == source_repo.get('full_name', '')):
                                  original_in_registry = True
                                  print(f"  ✗ Original repo '{entry_id}' is already in the registry")
                                  print(f"::error file={filepath}::Fork submissions not allowed when original repository is in the registry")
                                  print(f"  The plugin '{parent_full_name}' is already listed. Fork submissions are only")
                                  print(f"  allowed when the original repository is not yet registered.")
                                  PERMISSION_ERRORS += 1
                                  break

                  if not original_in_registry:
                      print(f"  ✓ Original not in registry - fork submission allowed")
                      print(f"  Fork metadata will be set during approval")

              elif owner == pr_author:
                  print(f"  ✓ Author owns this repository")
                  print(f"  → Permission check passed")

              else:
                  # ── Check: Is author a collaborator with push access? ─────────
                  print(f"  Checking collaboration status...")

                  collab_url = f"https://api.github.com/repos/{owner}/{repo}/collaborators/{pr_author}/permission"
                  req = urllib.request.Request(collab_url, headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {gh_token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })

                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          perm_data = json.loads(resp.read())
                          permission = perm_data.get('permission', '')

                          # push, maintain, or admin = can manage releases
                          if permission in ['admin', 'push', 'maintain']:
                              print(f"  ✓ Author has {permission} permission")
                              print(f"  → Permission check passed")
                          else:
                              print(f"  ✗ Author has {permission} permission (insufficient)")
                              print(f"::error file={filepath}::You do not have permission to submit this repository")
                              print(f"  Only the repository owner or collaborators with push/maintain/admin access")
                              print(f"  can submit a plugin. Your current permission: {permission}")
                              PERMISSION_ERRORS += 1

                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          print(f"  ✗ Author is not a collaborator on this repository")
                          print(f"::error file={filepath}::You do not have permission to submit this repository")
                          print(f"  Only the repository owner or collaborators with push/maintain/admin access")
                          print(f"  can submit a plugin.")
                          PERMISSION_ERRORS += 1
                      elif e.code == 403:
                          print(f"  ✗ Cannot verify permissions (API rate limit or access denied)")
                          print(f"  ::warning file={filepath}::Could not verify collaboration status")
                      else:
                          print(f"  ✗ Error checking permission (HTTP {e.code})")
                          print(f"::error file={filepath}::Failed to verify repository permissions")
                          PERMISSION_ERRORS += 1
                  except Exception as e:
                      print(f"  ✗ Error: {e}")
                      print(f"::error file={filepath}::Failed to verify repository permissions")
                      PERMISSION_ERRORS += 1

          print("\n" + "="*50)
          if PERMISSION_ERRORS > 0:
              print(f"Permission check failed: {PERMISSION_ERRORS} error(s)")
              print("Only repository owners or collaborators can submit plugins.")
              exit(1)
          else:
              print("All permission checks passed!")
          PYEOF

      # ── Fetch plugin.yml from each repo ──────────────────────────────────
      - name: Fetch plugin.yml from repositories
        id: fetch-plugin-yml
        if: steps.find-files.outputs.files != ''
        env:
          FILES: ${{ steps.find-files.outputs.files }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import urllib.request
          import json

          files = os.environ.get('FILES', '').strip()
          if not files:
              print("No files to process")
              exit(0)

          for filepath in files.split('\n'):
              filepath = filepath.strip()
              if not filepath:
                  continue

              print(f"\n{'='*50}")
              print(f"Processing: {filepath}")
              print('='*50)

              try:
                  import yaml
                  with open(filepath) as f:
                      data = yaml.safe_load(f) or {}
              except Exception as e:
                  print(f"::error file={filepath}::Failed to parse YAML: {e}")
                  continue

              repo_url = data.get('repo_url', '')
              if not repo_url:
                  continue

              parts = repo_url.replace('https://github.com/', '').split('/')
              owner = parts[0]
              repo = parts[1].rstrip('/') if len(parts) > 1 else ''

              print(f"Fetching plugin.yml from {owner}/{repo}...")

              # Fetch plugin.yml
              url = f"https://api.github.com/repos/{owner}/{repo}/contents/plugin.yml"
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {os.environ.get("GH_TOKEN", "")}',
                  'X-GitHub-Api-Version': '2022-11-28',
              })

              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      import base64
                      content_data = json.loads(resp.read())
                      content = base64.b64decode(content_data['content']).decode('utf-8')

                      # Parse plugin.yml
                      name = re.search(r'^name:\s*(.+)$', content, re.MULTILINE)
                      version = re.search(r'^version:\s*(.+)$', content, re.MULTILINE)

                      print(f"  plugin.yml found ✓")
                      if name:
                          print(f"  name: {name.group(1).strip()}")
                      if version:
                          print(f"  version: {version.group(1).strip()}")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print(f"::error file={filepath}::plugin.yml not found in {owner}/{repo}")
                  else:
                      print(f"::error file={filepath}::Failed to fetch plugin.yml (HTTP {e.code})")
              except Exception as e:
                  print(f"::error file={filepath}::Error: {e}")

          print("\n" + "="*50)
          print("plugin.yml check complete")
          print("="*50)

          PYEOF

      # ── Check for stable release ─────────────────────────────────────────
      - name: Check stable releases
        id: check-releases
        if: steps.find-files.outputs.files != ''
        env:
          FILES: ${{ steps.find-files.outputs.files }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 << 'PYEOF'
          import os
          import urllib.request
          import json

          files = os.environ.get('FILES', '').strip()
          if not files:
              exit(0)

          for filepath in files.split('\n'):
              filepath = filepath.strip()
              if not filepath:
                  continue

              try:
                  import yaml
                  with open(filepath) as f:
                      data = yaml.safe_load(f) or {}
              except:
                  continue

              repo_url = data.get('repo_url', '')
              if not repo_url:
                  continue

              parts = repo_url.replace('https://github.com/', '').split('/')
              owner = parts[0]
              repo = parts[1].rstrip('/') if len(parts) > 1 else ''

              print(f"Checking releases for {owner}/{repo}...")

              # Check latest release
              url = f"https://api.github.com/repos/{owner}/{repo}/releases/latest"
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {os.environ.get("GH_TOKEN", "")}',
                  'X-GitHub-Api-Version': '2022-11-28',
              })

              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      release = json.loads(resp.read())
                      tag = release.get('tag_name', 'unknown')
                      assets = release.get('assets', [])

                      phar_found = False
                      for asset in assets:
                          if asset['name'].lower().endswith('.phar'):
                              phar_found = True
                              print(f"  Release: {tag} ✓")
                              print(f"  .phar asset: {asset['name']} ✓")
                              break

                      if not phar_found:
                          print(f"::warning file={filepath}::No .phar asset found in latest release ({tag})")
                          print(f"  A stable release with .phar is required for listing")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print(f"::error file={filepath}::No stable release found in {owner}/{repo}")
                      print(f"  Create a release with a .phar asset first")
                  else:
                      print(f"::warning::Failed to check releases (HTTP {e.code})")
              except Exception as e:
                  print(f"::warning::Error checking releases: {e}")

          PYEOF

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Validation summary
        if: steps.find-files.outputs.files != ''
        run: |
          echo ""
          echo "========================================"
          echo "Validation Complete"
          echo "========================================"
          echo ""
          echo "Submission files validated:"
          echo "${{ steps.find-files.outputs.files }}"
          echo ""
          echo "If all checks passed, maintainers can review and add the 'approved' label to merge."

  # ═══════════════════════════════════════════════════════════════════════════
  # SECURITY SCAN JOB
  # Performs attestation verification and code security analysis
  # ═══════════════════════════════════════════════════════════════════════════
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    # Only run on PR events (needs PR context)
    if: github.event_name == 'pull_request'

    outputs:
      # These outputs are consumed by the validation job or for reporting
      attestation_tier: ${{ steps.check-attestation.outputs.tier }}
      attestation_message: ${{ steps.check-attestation.outputs.message }}
      plugin_repo: ${{ steps.get-submission.outputs.plugin_repo }}

    steps:
      # ── Setup: Install gh CLI and jq ──────────────────────────────────────
      - name: Setup tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if gh is available
          if ! command -v gh &> /dev/null; then
            echo "Installing GitHub CLI..."
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt update
            apt install gh jq
          else
            # Ensure jq is installed
            apt-get update && apt-get install -y jq || true
          fi
          gh auth status

      # ── Get submission info ───────────────────────────────────────────────
      - name: Get submission info
        id: get-submission
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 << 'PYEOF'
          import os
          import urllib.request
          import urllib.parse
          import json

          pr_number = os.environ.get('PR_NUMBER', '')
          pr_head_sha = os.environ.get('PR_HEAD_SHA', '')
          gh_token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          gh_output_path = os.environ.get('GITHUB_OUTPUT')

          def set_output(name, value):
              # Writing outputs requires appending "name=value" to the file
              # pointed to by $GITHUB_OUTPUT. The old "::set-output" workflow
              # command was deprecated and no longer works on GitHub-hosted
              # runners, and "value >> path" isn't valid Python (it tries to
              # bit-shift two strings, which raises a TypeError).
              if not gh_output_path:
                  return
              with open(gh_output_path, 'a') as out:
                  out.write(f"{name}={value}\n")

          # Get PR files
          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files"
          req = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {gh_token}',
              'X-GitHub-Api-Version': '2022-11-28',
          })

          submission_file = None
          with urllib.request.urlopen(req, timeout=30) as resp:
              files = json.loads(resp.read())
              for f in files:
                  if f.get('status') == 'added' and f.get('filename', '').startswith('submissions/'):
                      if f['filename'].endswith('.yaml') or f['filename'].endswith('.yml'):
                          submission_file = f['filename']
                          break

          if not submission_file:
              print("No submission file found")
              set_output('plugin_repo', '')
              exit(0)

          # Read the file as it exists at the PR head.  Omitting ``ref`` makes
          # the Contents API read the default branch, where a newly-added
          # submission does not exist yet and therefore returns HTTP 404.
          content_url = f"https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(submission_file)}"
          if pr_head_sha:
              content_url += '?' + urllib.parse.urlencode({'ref': pr_head_sha})
          req = urllib.request.Request(content_url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {gh_token}',
              'X-GitHub-Api-Version': '2022-11-28',
          })

          with urllib.request.urlopen(req, timeout=30) as resp:
              file_data = json.loads(resp.read())
              import base64
              content = base64.b64decode(file_data['content']).decode('utf-8')

              # Parse YAML
              import yaml
              data = yaml.safe_load(content)

              repo_url = data.get('repo_url', '')
              if repo_url:
                  parts = repo_url.replace('https://github.com/', '').split('/')
                  owner = parts[0]
                  plugin_repo = parts[1].rstrip('/') if len(parts) > 1 else ''
                  plugin_full = f"{owner}/{plugin_repo}"
                  print(f"plugin_repo={plugin_full}")
                  set_output('plugin_repo', plugin_full)
              else:
                  print("No repo_url found in submission")
                  set_output('plugin_repo', '')

          PYEOF

      # ── Check Attestation ─────────────────────────────────────────────────
      - name: Check attestation
        id: check-attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGIN_REPO="${{ steps.get-submission.outputs.plugin_repo }}"
          SIGNER_WORKFLOW='axolotl-pm/pmmp-plugin-actions/.github/workflows/build-phar.yml'

          if [ -z "$PLUGIN_REPO" ]; then
            echo "No plugin repo found, skipping attestation check"
            echo "tier=skipped" >> "$GITHUB_OUTPUT"
            echo "message=No submission file found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking attestation for: $PLUGIN_REPO"
          echo ""

          # Get latest release info
          RELEASE_JSON=$(gh api repos/$PLUGIN_REPO/releases/latest --jq '{
            tag: .tag_name,
            url: (.assets[] | select(.name | test("\\.phar$"; "i")) | .browser_download_url) // "",
            name: (.assets[] | select(.name | test("\\.phar$"; "i")) | .name) // "",
            prerelease: .prerelease,
            uploader: .assets[0].uploader.login // "unknown"
          }')

          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag')
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.url')
          ASSET_NAME=$(echo "$RELEASE_JSON" | jq -r '.name')
          IS_PRERELEASE=$(echo "$RELEASE_JSON" | jq -r '.prerelease')
          UPLOADER=$(echo "$RELEASE_JSON" | jq -r '.uploader')

          echo "Latest release: $TAG"
          echo "Asset: $ASSET_NAME"
          echo "Download URL: $DOWNLOAD_URL"
          echo "Pre-release: $IS_PRERELEASE"
          echo "Uploader: $UPLOADER"
          echo ""

          if [ "$DOWNLOAD_URL" == "null" ] || [ -z "$DOWNLOAD_URL" ]; then
            echo "No downloadable .phar found"
            echo "tier=no-phar" >> "$GITHUB_OUTPUT"
            echo "message=No .phar found in latest release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get source digest from release tag
          SOURCE_DIGEST=""
          if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
            echo "Getting source digest from tag..."
            # A release may disappear or have a tag that cannot be resolved.
            # This digest is optional, so do not let an API 404 fail the job
            # before the attestation can be reported as unverified.
            TARGET=$(gh api "repos/$PLUGIN_REPO/releases/tags/$TAG" --jq '.target_commitish // empty' 2>/dev/null || true)
            if [ -n "$TARGET" ] && [ ${#TARGET} -eq 40 ]; then
              SOURCE_DIGEST="$TARGET"
              echo "Source digest (from release): ${SOURCE_DIGEST:0:16}..."
            fi

            # Fallback to tag API
            if [ -z "$SOURCE_DIGEST" ]; then
              TAG_SHA=$(gh api "repos/$PLUGIN_REPO/git/refs/tags/$TAG" --jq '.[0].object.sha // empty' 2>/dev/null || true)
              if [ -n "$TAG_SHA" ]; then
                SOURCE_DIGEST="$TAG_SHA"
                echo "Source digest (from tag): ${SOURCE_DIGEST:0:16}..."
              fi
            fi
          fi

          echo ""
          echo "Running attestation verification..."
          echo ""

          # Build the command as an array so the inputs remain quoted safely.
          # `if` suppresses bash -e for a failed verification: an invalid or
          # absent attestation is an expected result, not a workflow failure.
          VERIFY_ARGS=(attestation verify "$DOWNLOAD_URL" --repo "$PLUGIN_REPO" --signer-workflow "$SIGNER_WORKFLOW")
          if [ -n "$SOURCE_DIGEST" ]; then
            VERIFY_ARGS+=(--source-digest "git-sha:$SOURCE_DIGEST")
          fi

          # Run verification
          printf 'Command:'
          printf ' %q' gh "${VERIFY_ARGS[@]}"
          printf '\n'
          if VERIFY_OUTPUT=$(gh "${VERIFY_ARGS[@]}" 2>&1); then
            VERIFY_EXIT=0
          else
            VERIFY_EXIT=$?
          fi

          echo "$VERIFY_OUTPUT"
          echo ""
          echo "Exit code: $VERIFY_EXIT"
          echo ""

          if [ $VERIFY_EXIT -eq 0 ]; then
            echo "✓ Attestation verified successfully"
            echo "tier=verified" >> "$GITHUB_OUTPUT"
            echo "message=Plugin .phar is verified via SLSA attestation from axolotl-pm/pmmp-plugin-actions" >> "$GITHUB_OUTPUT"
          else
            # Verification failed - tier is unverified
            echo "✗ Attestation verification failed - tier is unverified"
            echo "tier=unverified" >> "$GITHUB_OUTPUT"
            echo "message=.phar is not verified via SLSA attestation. For verified builds, use pmmp-plugin-actions." >> "$GITHUB_OUTPUT"
          fi

      # ── PHP security scan of the submitted plugin ─────────────────────────
      # CodeQL does not support PHP. Semgrep supports PHP and scans the plugin
      # repository itself (not this registry) with security-audit rules.
      - name: Scan submitted plugin PHP source
        id: php-security-scan
        if: steps.get-submission.outputs.plugin_repo != ''
        env:
          PLUGIN_REPO: ${{ steps.get-submission.outputs.plugin_repo }}
        run: |
          set -euo pipefail

          PLUGIN_DIR="$(mktemp -d /tmp/plugin-source.XXXXXX)"
          echo "Cloning source for security scan: $PLUGIN_REPO"
          # The repository URL was validated earlier. Do not pass this
          # workflow's token to the submitted repository.
          git clone --depth 1 --no-recurse-submodules "https://github.com/${PLUGIN_REPO}.git" "$PLUGIN_DIR"

          echo "Scanning PHP source for warnings that need human review..."
          # Findings are printed to the Actions log, but without `--error`
          # Semgrep exits successfully so warnings do not block the PR.
          WARNINGS_JSON="$(mktemp /tmp/semgrep-warnings.XXXXXX.json)"
          docker run --rm \
            --volume "$PLUGIN_DIR:/src:ro" \
            semgrep/semgrep \
            semgrep scan \
              --config p/php \
              --config p/security-audit \
              --severity WARNING \
              --json \
              --metrics=off \
              /src > "$WARNINGS_JSON"

          # Pass a compact, Markdown-safe list of warnings to the automated
          # PR comment. Limit it to avoid exceeding GitHub output limits.
          python3 - "$WARNINGS_JSON" << 'PYEOF'
          import json
          import os
          import sys
          import uuid

          with open(sys.argv[1], encoding='utf-8') as report:
              findings = json.load(report).get('results', [])

          def compact(value, limit=240):
              return ' '.join(str(value or '').split()).replace('|', '\\|').replace('`', "'")[:limit]

          if findings:
              shown = findings[:20]
              lines = [
                  ':warning: **Semgrep WARNING findings — human review required**',
                  '',
                  '| File | Line | Rule | Finding |',
                  '|---|---:|---|---|',
              ]
              for finding in shown:
                  extra = finding.get('extra', {})
                  path = str(finding.get('path', '')).removeprefix('/src/')
                  line = finding.get('start', {}).get('line', '?')
                  lines.append(
                      f"| `{compact(path)}` | {line} | `{compact(finding.get('check_id'))}` | {compact(extra.get('message'))} |"
                  )
              if len(findings) > len(shown):
                  lines.extend(['', f"> Showing the first {len(shown)} of {len(findings)} warnings; see the workflow log for the full list."])
              summary = '\n'.join(lines)
          else:
              summary = ':white_check_mark: No Semgrep WARNING findings.'

          output_path = os.environ['GITHUB_OUTPUT']
          delimiter = f"SEMGREP_WARNINGS_{uuid.uuid4().hex}"
          with open(output_path, 'a', encoding='utf-8') as output:
              output.write(f"warnings_summary<<{delimiter}\n{summary}\n{delimiter}\n")
          print(summary)
          PYEOF

          echo "Scanning PHP source for blocking security errors..."
          # Only ERROR findings fail the check. They need human review and a
          # fix or an explicit maintainer decision before approval.
          docker run --rm \
            --volume "$PLUGIN_DIR:/src:ro" \
            semgrep/semgrep \
            semgrep scan \
              --config p/php \
              --config p/security-audit \
              --severity ERROR \
              --error \
              --metrics=off \
              /src

      # ── Post PR Comment with Security Summary ────────────────────────────
      - name: Post security report comment
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_REPO: ${{ steps.get-submission.outputs.plugin_repo }}
          ATTESTATION_TIER: ${{ steps.check-attestation.outputs.tier }}
          ATTESTATION_MSG: ${{ steps.check-attestation.outputs.message }}
          PHP_WARNING_SUMMARY: ${{ steps.php-security-scan.outputs.warnings_summary }}
        run: |
          if [ -z "$PLUGIN_REPO" ]; then
            echo "No plugin repo, skipping comment"
            exit 0
          fi

          echo "Plugin Repo: $PLUGIN_REPO"
          echo "Attestation Tier: $ATTESTATION_TIER"
          echo "Attestation Message: $ATTESTATION_MSG"

          # Determine badge based on tier
          case "$ATTESTATION_TIER" in
            verified)
              ICON="&#10004;"
              BADGE="Verified"
              ;;
            *)
              ICON="&#10060;"
              BADGE="Unverified"
              ;;
          esac

          NOW=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          # Build comment header.
          # NOTE: this heredoc is intentionally UNQUOTED (<< COMMENTEOF, not
          # << 'COMMENTEOF') so $PLUGIN_REPO/$ICON/$BADGE/$ATTESTATION_MSG/$NOW
          # are substituted directly. The previous version used repeated "%s"
          # placeholders filled in afterwards with `sed -i "s/%s/.../g"` — but
          # each sed call replaces EVERY "%s" in the whole file (the `g` flag
          # only means "all matches per line", and sed -i still scans every
          # line), so the very first sed pass overwrote all five placeholders
          # with $PLUGIN_REPO and the rest of the fields never got filled in.
          cat > /tmp/comment_body.txt << COMMENTEOF
          ## Security Analysis Report

          ### Plugin: $PLUGIN_REPO

          ***

          ### Attestation Check
          $ICON **Status:** $BADGE

          $ATTESTATION_MSG

          > For the best security rating, use [pmmp-plugin-actions](https://github.com/axolotl-pm/pmmp-plugin-actions) for your CI/CD pipeline.

          ***

          ### PHP Security Analysis
          :white_check_mark: **Status:** No blocking ERROR findings

          > Semgrep scans the submitted plugin repository's PHP source using PHP and security-audit rules. ERROR findings block approval; WARNING findings are listed below for human review.

          $PHP_WARNING_SUMMARY

          ***

          ### Summary
          COMMENTEOF

          # Add recommendation based on tier
          case "$ATTESTATION_TIER" in
            verified)
              cat >> /tmp/comment_body.txt << 'SUMMARYEOF'
          &#10004; **Ready for approval** - All security checks passed.

          | Check | Status |
          |-------|--------|
          | Attestation | &#10004; Verified |
          | PHP security scan | &#10004; No blocking errors |
          SUMMARYEOF
              ;;
            *)
              cat >> /tmp/comment_body.txt << 'SUMMARYEOF'
          &#10060; **Manual review required** - Attestation not verified.

          | Check | Status |
          |-------|--------|
          | Attestation | &#10060; Unverified |
          | PHP security scan | &#10004; No blocking errors |

          > For verified builds, use [pmmp-plugin-actions](https://github.com/axolotl-pm/pmmp-plugin-actions).
          SUMMARYEOF
              ;;
          esac

          # Add footer (unquoted heredoc so $NOW expands directly)
          cat >> /tmp/comment_body.txt << FOOTEREOF

          ***
          *This report is generated automatically. Last updated: $NOW*
          FOOTEREOF

          echo "Comment body prepared:"
          cat /tmp/comment_body.txt

          # Post or update comment
          echo ""
          echo "Posting security report comment..."

          # Check if comment already exists
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '.[] | select(.body | contains("Security Analysis Report")) | .id' \
            2>/dev/null | head -1)

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating existing comment $COMMENT_ID..."
            gh api --method PATCH repos/${{ github.repository }}/issues/comments/$COMMENT_ID \
              --field body="$(cat /tmp/comment_body.txt)"
          else
            echo "Creating new comment..."
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              --method POST \
              --field body="$(cat /tmp/comment_body.txt)"
          fi

          echo "Comment posted successfully"
