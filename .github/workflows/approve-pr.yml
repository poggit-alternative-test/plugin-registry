name: Approve Plugin Submission

# Triggered when PR is merged (closed with 'approved' label).
# Validates, generates full entry, and updates index.json.
on:
  pull_request:
    types: [closed]

# Permissions granted only when actually needed
permissions:
  contents: write
  issues: write

jobs:
  approve:
    name: Approve submission
    runs-on: ubuntu-latest
    # Only run on merge, and only if approved label was present
    if: github.event.pull_request.merged == true

    steps:
      # ── Checkout merged code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Find submission files ──────────────────────────────────────────────
      - name: Find submission files
        id: find-files
        run: |
          FILES=$(find submissions -name "*.yaml" -o -name "*.yml" 2>/dev/null | sort)

          if [ -z "$FILES" ]; then
            echo "No submission files found - nothing to approve"
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found submission files:"
          echo "$FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      # ── Fail if no files ─────────────────────────────────────────────────
      - name: Check for submission files
        if: steps.find-files.outputs.files == ''
        run: |
          echo "No submission files to process. This PR may not be a plugin submission."
          exit 0

      # ── Process each submission file ──────────────────────────────────────
      - name: Process submissions
        id: process
        env:
          FILES: ${{ steps.find-files.outputs.files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          python3 << 'PYEOF'
            import json
            import os
            import re
            import base64
            import urllib.request
            from datetime import datetime, timezone

            # Environment
            files = os.environ.get('FILES', '').strip()
            pr_number = os.environ.get('PR_NUMBER', '')
            gh_token = os.environ.get('GH_TOKEN', '')

            valid_categories = ["admin", "economy", "chat", "world", "protection", "gameplay", "fun", "api", "tools", "misc"]

            def gh_api(path):
                """Make authenticated GitHub API request"""
                url = f"https://api.github.com{path}"
                req = urllib.request.Request(url, headers={
                    'Accept': 'application/vnd.github+json',
                    'Authorization': f'Bearer {gh_token}',
                    'X-GitHub-Api-Version': '2022-11-28',
                })
                with urllib.request.urlopen(req, timeout=30) as resp:
                    return json.loads(resp.read())

            def strip_quotes(s):
                """Strip wrapping quotes from YAML strings"""
                s = s.strip()
                if len(s) >= 2 and s[0] == s[-1] and s[0] in ('"', "'"):
                    s = s[1:-1]
                return s.strip()

            # Load existing index
            index_path = 'data/index.json'
            if os.path.exists(index_path):
                with open(index_path) as f:
                    index = json.load(f)
            else:
                index = []

            processed_files = []
            errors = []

            for filepath in files.split('\n'):
                filepath = filepath.strip()
                if not filepath:
                    continue

                print(f"\n{'='*60}")
                print(f"Processing: {filepath}")
                print('='*60)

                # Parse YAML
                import yaml
                with open(filepath) as f:
                    submission = yaml.safe_load(f)

                repo_url = submission.get('repo_url', '')
                category = submission.get('category', '')
                icon_path = submission.get('icon_path')
                keywords = submission.get('keywords', [])

                # Validate
                if not repo_url:
                    errors.append(f"{filepath}: repo_url is required")
                    continue

                if category not in valid_categories:
                    errors.append(f"{filepath}: invalid category '{category}'")
                    continue

                # Parse owner/repo
                parts = repo_url.replace('https://github.com/', '').split('/')
                owner = parts[0]
                repo = parts[1].rstrip('/') if len(parts) > 1 else ''
                plugin_id = f"{owner}/{repo}"

                print(f"  repo: {plugin_id}")
                print(f"  category: {category}")

                # Fetch plugin.yml
                try:
                    plugin_data = gh_api(f"/repos/{owner}/{repo}/contents/plugin.yml")
                    content = base64.b64decode(plugin_data['content']).decode('utf-8')
                except Exception as e:
                    errors.append(f"{filepath}: Failed to fetch plugin.yml - {e}")
                    continue

                # Parse plugin.yml
                def get_field(name):
                    m = re.search(rf'^{name}:\s*(.+)$', content, re.MULTILINE)
                    return strip_quotes(m.group(1)) if m else ''

                name = get_field('name')
                version_raw = get_field('version')
                api_field = get_field('api')
                author_field = get_field('author')
                authors_field = get_field('authors')
                description = get_field('description')
                depend = get_field('depend')

                if not name:
                    errors.append(f"{filepath}: plugin.yml missing 'name' field")
                    continue

                if not version_raw:
                    errors.append(f"{filepath}: plugin.yml missing 'version' field")
                    continue

                # Parse API versions
                if api_field.startswith('-'):
                    api_list = [strip_quotes(i) for i in re.findall(r'^\s*-\s*(.+)', api_field, re.MULTILINE) if i.strip()]
                else:
                    api_list = [strip_quotes(s) for s in api_field.split(',') if s.strip()]

                # Parse authors
                if author_field:
                    author_list = [strip_quotes(a) for a in re.split(r'[,\s]+', author_field) if a.strip()]
                elif authors_field:
                    if ',' in authors_field or authors_field.startswith('-'):
                        author_list = [strip_quotes(a) for a in re.findall(r'^\s*-\s*(.+)', authors_field, re.MULTILINE) if a.strip()]
                    else:
                        author_list = [strip_quotes(authors_field)]
                else:
                    author_list = []

                print(f"  name: {name}")
                print(f"  version: {version_raw}")

                # Fetch latest release
                try:
                    release = gh_api(f"/repos/{owner}/{repo}/releases/latest")
                    release_tag = release.get('tag_name', '')
                    version = release_tag.lstrip('v') if release_tag else version_raw
                    download_url = ''
                    download_count = 0
                    phar_found = False

                    for asset in release.get('assets', []):
                        if asset['name'].lower().endswith('.phar'):
                            download_url = asset['browser_download_url']
                            download_count = asset.get('download_count', 0)
                            phar_found = True
                            print(f"  release: {release_tag}")
                            print(f"  .phar: {asset['name']}")
                            break

                    if not phar_found:
                        errors.append(f"{filepath}: No .phar found in latest release")
                        continue

                except Exception as e:
                    errors.append(f"{filepath}: Failed to fetch release - {e}")
                    continue

                # Check attestation
                build_tier = None
                checked_at = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

                # Fetch stargazers count
                try:
                    repo_data = gh_api(f"/repos/{owner}/{repo}")
                    stargazers_count = repo_data.get('stargazers_count', 0)
                    print(f"  stars: {stargazers_count}")
                except:
                    stargazers_count = 0

                # Resolve icon_url
                icon_url = None
                head_base = f"https://raw.githubusercontent.com/{owner}/{repo}/HEAD"

                if icon_path:
                    # Try submitted path
                    try:
                        req = urllib.request.Request(f"{head_base}/{icon_path}", method='HEAD')
                        with urllib.request.urlopen(req, timeout=10) as resp:
                            if resp.status == 200:
                                icon_url = f"{head_base}/{icon_path}"
                    except:
                        pass

                if not icon_url:
                    # Try icon.png
                    try:
                        req = urllib.request.Request(f"{head_base}/icon.png", method='HEAD')
                        with urllib.request.urlopen(req, timeout=10) as resp:
                            if resp.status == 200:
                                icon_url = f"{head_base}/icon.png"
                                icon_path = 'icon.png'
                    except:
                        pass

                if not icon_url:
                    # Try assets/icon.png
                    try:
                        req = urllib.request.Request(f"{head_base}/assets/icon.png", method='HEAD')
                        with urllib.request.urlopen(req, timeout=10) as resp:
                            if resp.status == 200:
                                icon_url = f"{head_base}/assets/icon.png"
                                icon_path = 'assets/icon.png'
                    except:
                        pass

                print(f"  icon: {icon_url or 'default'}")
                print(f"  keywords: {keywords}")

                # Create entry
                now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

                # Check if entry already exists
                existing_idx = None
                for i, entry in enumerate(index):
                    if entry.get('id') == plugin_id:
                        existing_idx = i
                        break

                if existing_idx is not None:
                    # Update existing entry
                    entry = index[existing_idx]
                    entry['tag'] = release_tag
                    entry['version'] = version
                    entry['api'] = api_list
                    entry['author'] = author_list
                    entry['description'] = description
                    entry['download_url'] = download_url
                    entry['download_count'] = download_count
                    entry['stargazers_count'] = stargazers_count
                    entry['icon_path'] = icon_path
                    entry['icon_url'] = icon_url
                    entry['build_tier'] = build_tier
                    entry['attestation_checked_at'] = checked_at
                    entry['last_synced_at'] = now

                    # Update keywords if provided
                    if keywords:
                        entry['keywords'] = keywords

                    # Add tag to all_tags if not present
                    if release_tag and release_tag not in entry.get('all_tags', []):
                        entry.setdefault('all_tags', []).insert(0, release_tag)

                    print(f"\n  ✓ Updated existing entry: {plugin_id}")
                else:
                    # Create new entry
                    entry = {
                        'id': plugin_id,
                        'name': name,
                        'tag': release_tag,
                        'version': version,
                        'all_tags': [release_tag] if release_tag else [],
                        'dev_build': None,
                        'api': api_list,
                        'author': author_list,
                        'description': description,
                        'category': category,
                        'icon_path': icon_path,
                        'icon_url': icon_url,
                        'repo_url': repo_url,
                        'download_url': download_url,
                        'download_count': download_count,
                        'stargazers_count': stargazers_count,
                        'build_tier': build_tier,
                        'attestation_checked_at': checked_at,
                        'approved_at': now,
                        'last_synced_at': now,
                        'featured': False,
                        'featured_marked_at': None,
                        'submission_pr_number': int(pr_number) if pr_number else None,
                        'keywords': keywords if keywords else [],
                    }
                    index.append(entry)
                    print(f"\n  ✓ Added new entry: {plugin_id}")

                processed_files.append(filepath)

            # Write updated index
            with open(index_path, 'w') as f:
                json.dump(index, f, indent=2)
                f.write('\n')

            print(f"\n{'='*60}")
            print(f"Processed {len(processed_files)} file(s)")
            print(f"Total entries in index: {len(index)}")

            if errors:
                print(f"\nErrors ({len(errors)}):")
                for err in errors:
                    print(f"  - {err}")

            # Write processed files for next step
            with open('/tmp/processed_files.json', 'w') as f:
                json.dump(processed_files, f)

            with open('/tmp/errors.json', 'w') as f:
                json.dump(errors, f)

            if errors:
                print("\n::error::Some submissions had errors")
                exit(1)

            PYEOF

      # ── Commit index changes ──────────────────────────────────────────────
      - name: Commit index changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/index.json
          git diff --staged --quiet && {
            echo "No changes to index - entry may already exist"
            exit 0
          }

          git commit -m "chore: approve plugin submission

          Approved via PR #${{ github.event.pull_request.number }}
          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          git push

          echo "Index updated successfully"

      # ── Delete submission files ───────────────────────────────────────────
      - name: Delete submission files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # Read processed files
          python3 << 'EOF'
            import json
            with open('/tmp/processed_files.json') as f:
                files = json.load(f)
            for filepath in files:
                print(f"Deleting: {filepath}")
            print(f"Total: {len(files)} files")
            EOF

                    # Delete files using git rm
                    python3 -c "
            import json
            with open('/tmp/processed_files.json') as f:
                files = json.load(f)
            for f in files:
                print(f'Deleting: {f}')
            "

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add deletions to staging
          for file in $(python3 -c "import json; print(' '.join(json.load(open('/tmp/processed_files.json'))))"); do
            git rm -f "$file" 2>/dev/null || true
          done

          # Check if there are any changes to commit
          git diff --staged --quiet && {
            echo "No files to delete"
            exit 0
          }

          git commit -m "chore: remove approved submission files

          Files processed and approved
          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          git push

          echo "Submission files deleted"

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "Approval Complete"
          echo "========================================"
          echo ""
          echo "PR #${{ github.event.pull_request.number }} has been approved."
          echo ""
          echo "The plugin has been added/updated in data/index.json"
          echo "and the submission files have been removed."
