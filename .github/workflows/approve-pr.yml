name: Approve Plugin Submission

# Triggered when:
# 1. PR is merged (closed with 'approved' label)
# 2. auto-approve workflow completes (after merging PR)
# Validates, generates full entry, and updates index.json.
on:
  pull_request:
    types: [closed]
  workflow_run:
    types: [completed]
    workflows: ["Auto Approve Plugin Submission"]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: false
        type: string

# Permissions granted only when actually needed
permissions:
  contents: write
  issues: write
  actions: read  # Needed to access workflow run data for workflow_run trigger

jobs:
  approve:
    name: Approve submission
    runs-on: ubuntu-latest

    steps:
      # ── Get workflow event data ───────────────────────────────────────────
      - name: Get workflow event data
        id: get_event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GH_TOKEN="${{ github.token }}"

          # For workflow_dispatch, we'll prompt for PR number
          # For workflow_run and pull_request, we get it from the event

          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            # Manual trigger - need PR number from input
            PR_NUMBER=$(python3 -c "import json; print(json.load(open('$GITHUB_EVENT_PATH')).get('inputs', {}).get('pr_number', ''))")
            if [ -z "$PR_NUMBER" ]; then
              echo "::warning::No PR number provided for manual trigger"
              echo "triggered_by=skip" >> "$GITHUB_OUTPUT"
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "base_branch=master" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BASE_BRANCH=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER --jq '.base.ref')
            echo "triggered_by=workflow_dispatch" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "Triggered by: workflow_dispatch, PR: $PR_NUMBER, Base: $BASE_BRANCH"

          elif [ "$GITHUB_EVENT_NAME" == "workflow_run" ]; then
            # Get workflow run ID from event file
            WORKFLOW_RUN_ID=$(python3 -c "import json,sys; f=open('$GITHUB_EVENT_PATH'); e=json.load(f); print(e.get('workflow_run',{}).get('id',''))" 2>/dev/null)
            echo "Getting PR info from workflow run: $WORKFLOW_RUN_ID"

            if [ -z "$WORKFLOW_RUN_ID" ]; then
              echo "::warning::No workflow run ID found"
              echo "triggered_by=skip" >> "$GITHUB_OUTPUT"
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "base_branch=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Get the PR number from the workflow run.
            # The workflow-run API's pull_requests entries do not reliably expose
            # the PR base.ref, so resolve the PR separately below.
            PR_NUMBER=$(gh api               "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID"               --jq '.pull_requests[0].number // empty' 2>/dev/null || true)

            if [ -z "$PR_NUMBER" ]; then
              echo "::warning::No PR found for this workflow run"
              echo "triggered_by=skip" >> "$GITHUB_OUTPUT"
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "base_branch=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Resolve the actual base branch from the PR itself.
            BASE_BRANCH=$(gh api               "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"               --jq '.base.ref // empty' 2>/dev/null || true)

            if [ -z "$BASE_BRANCH" ]; then
              echo "::warning::Unable to determine PR base branch"
              echo "triggered_by=skip" >> "$GITHUB_OUTPUT"
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "base_branch=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "triggered_by=workflow_run" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "Triggered by: workflow_run, PR: $PR_NUMBER, Base: $BASE_BRANCH"

          elif [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            # Check if merged
            IS_MERGED=$(python3 -c "import json; print(json.load(open('$GITHUB_EVENT_PATH')).get('pull_request', {}).get('merged', False))")
            if [ "$IS_MERGED" == "True" ]; then
              PR_NUMBER=$(python3 -c "import json; print(json.load(open('$GITHUB_EVENT_PATH')).get('pull_request', {}).get('number', ''))")
              BASE_BRANCH=$(python3 -c "import json; print(json.load(open('$GITHUB_EVENT_PATH')).get('pull_request', {}).get('base', {}).get('ref', ''))")
              echo "triggered_by=pull_request" >> "$GITHUB_OUTPUT"
              echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
              echo "Triggered by: pull_request, PR: $PR_NUMBER, Base: $BASE_BRANCH"
            else
              echo "triggered_by=skip" >> "$GITHUB_OUTPUT"
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "base_branch=" >> "$GITHUB_OUTPUT"
              echo "Skipping: PR not merged"
            fi
          else
            echo "triggered_by=skip" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "base_branch=" >> "$GITHUB_OUTPUT"
            echo "Unknown trigger event: $GITHUB_EVENT_NAME"
          fi

      # ── Skip if not a merge ─────────────────────────────────────────────
      - name: Skip if not merged
        if: steps.get_event.outputs.triggered_by == 'skip'
        run: exit 0

      # ── Checkout merged code ──────────────────────────────────────────────
      # Explicitly checkout the base branch (e.g. main) rather than relying on
      # the default merge-preview ref (refs/pull/N/merge), which GitHub tears
      # down once the PR is closed/merged and can cause checkout to fail here.
      # The base branch already contains the merged submission file at this point.
      - name: Checkout repository
        if: steps.get_event.outputs.triggered_by != 'skip'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.get_event.outputs.base_branch }}

      # ── Find submission files (NEWLY ADDED only) ─────────────────────────────
      - name: Find submission files
        if: steps.get_event.outputs.triggered_by != 'skip'
        id: find-files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.get_event.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          # Use GitHub API to list files changed in this PR.
          # At merge time we are on the base branch (already merged), so git diff
          # can't be used — we instead query the PR's own file list.
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os

          pr_number = os.environ.get('PR_NUMBER', '')
          gh_token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('REPO', '')

          if not pr_number:
              print("No PR number provided")
              # Write empty result
              with open('/tmp/added_files.txt', 'w') as f:
                  f.write('')
              exit(0)

          # Get the list of files in this PR
          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files"
          req = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {gh_token}',
              'X-GitHub-Api-Version': '2022-11-28',
          })

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  files = json.loads(resp.read())
                  added = []
                  for f in files:
                      if f.get('status') == 'added' and f.get('filename', '').startswith('submissions/'):
                          if f['filename'].endswith('.yaml') or f['filename'].endswith('.yml'):
                              added.append(f['filename'])
                  # Write to file
                  with open('/tmp/added_files.txt', 'w') as out:
                      out.write('\n'.join(sorted(added)))
                  print(f"Found {len(added)} submission files")
          except Exception as e:
              print(f"Error fetching PR files: {e}", file=__import__('sys').stderr)
              # Write empty result on error
              with open('/tmp/added_files.txt', 'w') as f:
                  f.write('')
              exit(1)

          PYEOF

          ADDED_FILES=$(cat /tmp/added_files.txt 2>/dev/null || echo '')

          if [ -z "$ADDED_FILES" ]; then
            echo "No new submission files added in this PR"
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found newly added submission files:"
          echo "$ADDED_FILES"

          {
            echo "files<<SUBMISSION_FILES_EOF"
            echo "$ADDED_FILES"
            echo "SUBMISSION_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Check for submission files ────────────────────────────────────────
      - name: Check for submission files
        if: steps.find-files.outputs.files == ''
        run: |
          echo "No submission files to process. This PR may not be a plugin submission."
          exit 0

      # ── Enforce one plugin per PR ────────────────────────────────────────
      - name: Enforce one plugin per PR
        if: steps.get_event.outputs.triggered_by != 'skip'
        run: |
          COUNT=$(echo "${{ steps.find-files.outputs.files }}" | wc -l)
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Multiple submission files detected"
            echo ""
            echo "Error: Only ONE plugin submission per PR is allowed."
            echo "Each plugin must be submitted via its own PR."
            exit 1
          fi
          echo "✓ Single submission file confirmed"

      # ── Process each submission file ──────────────────────────────────────
      - name: Process submissions
        if: steps.get_event.outputs.triggered_by != 'skip'
        id: process
        env:
          FILES: ${{ steps.find-files.outputs.files }}
          PR_NUMBER: ${{ steps.get_event.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          python3 << 'PYEOF'
          import json
          import os
          import re
          import base64
          import hashlib
          import urllib.request
          from datetime import datetime, timezone

          # Environment
          files = os.environ.get('FILES', '').strip()
          pr_number = os.environ.get('PR_NUMBER', '')
          gh_token = os.environ.get('GH_TOKEN', '')

          valid_categories = ["admin", "economy", "chat", "world", "protection", "gameplay", "fun", "api", "tools", "misc"]

          def gh_api(path):
              """Make authenticated GitHub API request"""
              url = f"https://api.github.com{path}"
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {gh_token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read())

          def strip_quotes(s):
              """Strip wrapping quotes from YAML strings"""
              s = s.strip()
              if len(s) >= 2 and s[0] == s[-1] and s[0] in ('"', "'"):
                  s = s[1:-1]
              return s.strip()

          # Load existing index
          index_path = 'data/index.json'
          if os.path.exists(index_path):
              with open(index_path) as f:
                  index = json.load(f)
          else:
              index = []

          processed_files = []
          errors = []

          for filepath in files.split('\n'):
              filepath = filepath.strip()
              if not filepath:
                  continue

              print(f"\n{'='*60}")
              print(f"Processing: {filepath}")
              print('='*60)

              # Parse YAML
              import yaml
              with open(filepath) as f:
                  submission = yaml.safe_load(f)

              repo_url = submission.get('repo_url', '')
              category = submission.get('category', '')
              icon_path = submission.get('icon_path')
              keywords = submission.get('keywords', [])

              # Validate
              if not repo_url:
                  errors.append(f"{filepath}: repo_url is required")
                  continue

              if category not in valid_categories:
                  errors.append(f"{filepath}: invalid category '{category}'")
                  continue

              # Parse owner/repo
              parts = repo_url.replace('https://github.com/', '').split('/')
              owner = parts[0]
              repo = parts[1].rstrip('/') if len(parts) > 1 else ''
              plugin_id = f"{owner}/{repo}"

              print(f"  repo: {plugin_id}")
              print(f"  category: {category}")

              # Detect fork using GitHub API
              fork = False
              forked_from = None
              try:
                  repo_info = gh_api(f"/repos/{owner}/{repo}")
                  is_fork = repo_info.get('fork', False)
                  if is_fork:
                      parent = repo_info.get('parent')
                      if parent:
                          fork = True
                          forked_from = parent.get('full_name')
                          print(f"  fork: detected (forked from {forked_from})")
                      else:
                          source = repo_info.get('source')
                          if source:
                              fork = True
                              forked_from = source.get('full_name')
                              print(f"  fork: detected (forked from {forked_from})")
              except Exception as e:
                  print(f"  fork detection skipped: {e}")

              # Fetch plugin.yml
              try:
                  plugin_data = gh_api(f"/repos/{owner}/{repo}/contents/plugin.yml")
                  content = base64.b64decode(plugin_data['content']).decode('utf-8')
              except Exception as e:
                  errors.append(f"{filepath}: Failed to fetch plugin.yml - {e}")
                  continue

              # Parse plugin.yml
              def get_field(name):
                  m = re.search(rf'^{name}:\s*(.+)$', content, re.MULTILINE)
                  return strip_quotes(m.group(1)) if m else ''

              name = get_field('name')
              version_raw = get_field('version')
              api_field = get_field('api')
              author_field = get_field('author')
              authors_field = get_field('authors')
              description = get_field('description')
              depend = get_field('depend')

              if not name:
                  errors.append(f"{filepath}: plugin.yml missing 'name' field")
                  continue

              if not version_raw:
                  errors.append(f"{filepath}: plugin.yml missing 'version' field")
                  continue

              # Parse API versions
              if api_field.startswith('-'):
                  api_list = [strip_quotes(i) for i in re.findall(r'^\s*-\s*(.+)', api_field, re.MULTILINE) if i.strip()]
              else:
                  api_list = [strip_quotes(s) for s in api_field.split(',') if s.strip()]

              # Parse authors
              if author_field:
                  author_list = [strip_quotes(a) for a in re.split(r'[,\s]+', author_field) if a.strip()]
              elif authors_field:
                  if ',' in authors_field or authors_field.startswith('-'):
                      author_list = [strip_quotes(a) for a in re.findall(r'^\s*-\s*(.+)', authors_field, re.MULTILINE) if a.strip()]
                  else:
                      author_list = [strip_quotes(authors_field)]
              else:
                  author_list = []

              print(f"  name: {name}")
              print(f"  version: {version_raw}")

              # Fetch all releases to determine stable vs nightly
              dev_build = None
              stable_release = None
              latest_tag = ''
              all_releases = []

              try:
                  all_releases = gh_api(f"/repos/{owner}/{repo}/releases")

                  # First pass: find latest stable release and nightly build
                  for rel in all_releases:
                      tag = rel.get('tag_name', '')
                      is_prerelease = rel.get('prerelease', False)

                      # Check for nightly build (tag contains "nightly")
                      if 'nightly' in tag.lower():
                          if dev_build is None:  # Take the first/most recent nightly
                              for asset in rel.get('assets', []):
                                  if asset['name'].lower().endswith('.phar'):
                                      dev_build = {
                                          'tag': tag,
                                          'download_url': asset['browser_download_url']
                                      }
                                      print(f"  nightly: {tag}")
                                      print(f"  dev_build: enabled")
                                      break

                      # Track stable release (non-prerelease, or has "nightly" in tag but is the main release)
                      # Priority: non-prerelease > prerelease
                      if not is_prerelease:
                          if stable_release is None:
                              stable_release = rel
                          # Or if this has a higher tag than current stable
                          elif latest_tag and tag > latest_tag:
                              stable_release = rel
                      latest_tag = tag

                  # If no non-prerelease found but we have releases, use the latest
                  if stable_release is None and all_releases:
                      # Filter out releases without .phar assets
                      for rel in all_releases:
                          has_phar = any(a['name'].lower().endswith('.phar') for a in rel.get('assets', []))
                          if has_phar:
                              stable_release = rel
                              break

                  # If no stable release, check if this IS a nightly plugin (nightly is the main thing)
                  if stable_release is None and dev_build is not None:
                      # This plugin only has nightly builds - use nightly as the main version
                      stable_release = dev_build  # Will be handled below
                      print(f"  Using nightly as main version")

              except Exception as e:
                  errors.append(f"{filepath}: Failed to fetch releases - {e}")
                  continue

              # Process stable release
              if stable_release is None or (isinstance(stable_release, dict) and not stable_release.get('assets')):
                  errors.append(f"{filepath}: No stable release found")
                  continue

              if isinstance(stable_release, dict):
                  release_tag = stable_release.get('tag_name', '')
                  version = release_tag.lstrip('v') if release_tag else version_raw
                  download_url = ''
                  download_count = 0
                  phar_found = False

                  for asset in stable_release.get('assets', []):
                      if asset['name'].lower().endswith('.phar'):
                          download_url = asset['browser_download_url']
                          download_count = asset.get('download_count', 0)
                          phar_found = True
                          print(f"  release: {release_tag}")
                          print(f"  .phar: {asset['name']}")
                          break

                  if not phar_found:
                      errors.append(f"{filepath}: No .phar found in stable release")
                      continue
              else:
                  # stable_release is actually dev_build (nightly-only plugin)
                  release_tag = stable_release['tag']
                  version = release_tag
                  download_url = stable_release['download_url']
                  download_count = 0
                  phar_found = True

              # Calculate total downloads across all stable releases
              download_total = 0
              try:
                  for rel in all_releases:
                      # Only count stable (non-prerelease) releases
                      if not rel.get('prerelease', False) and 'nightly' not in rel.get('tag_name', '').lower():
                          for asset in rel.get('assets', []):
                              if asset['name'].lower().endswith('.phar'):
                                  download_total += asset.get('download_count', 0)
                                  break  # only count .phar per release
                  print(f"  download_total: {download_total}")
              except Exception as e:
                  download_total = download_count
                  print(f"  download_total: {download_total} (current release only)")

              # ── Check attestation via gh CLI ─────────────────────────────────
              # Uses gh attestation verify with policy enforcement
              build_tier = None
              checked_at = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

              SIGNER_WORKFLOW = 'axolotl-pm/pmmp-plugin-actions/.github/workflows/build-phar.yml'

              try:
                  import hashlib
                  import subprocess
                  import json as json_lib

                  phar_path = '/tmp/attestation_check.phar'
                  urllib.request.urlretrieve(download_url, phar_path)

                  # Compute SHA256 of the file
                  sha256_hash = hashlib.sha256(open(phar_path, 'rb').read()).hexdigest()
                  print(f"  PHAR SHA256: {sha256_hash[:16]}...")

                  # ── Get source digest from release tag ──────────────────────────
                  # The source digest is the git commit SHA that was used to build the .phar
                  # We can get this from the release's target_commitish or by fetching the tag
                  source_digest = None

                  if release_tag:
                      # Method 1: Try to get from release API (target_commitish)
                      try:
                          releases_data = gh_api(f"/repos/{owner}/{repo}/releases/tags/{release_tag}")
                          target = releases_data.get('target_commitish') or releases_data.get('target_commitish')
                          if target and len(target) == 40:  # Looks like a SHA
                              source_digest = target
                              print(f"  source digest (from release): {source_digest[:16]}...")
                      except Exception as e:
                          print(f"  Could not get source digest from release API: {e}")

                      # Method 2: Fallback - get from tag API
                      if not source_digest:
                          try:
                              tag_data = gh_api(f"/repos/{owner}/{repo}/git/refs/tags/{release_tag}")
                              if isinstance(tag_data, list) and tag_data:
                                  tag_obj = tag_data[0]
                                  if tag_obj.get('object', {}).get('sha'):
                                      source_digest = tag_obj['object']['sha']
                                      print(f"  source digest (from tag): {source_digest[:16]}...")
                              elif isinstance(tag_data, dict):
                                  # Annotated tag response
                                  obj_sha = tag_data.get('object', {}).get('sha', '')
                                  # Get the commit SHA from annotated tag
                                  if obj_sha:
                                      commit_data = gh_api(f"/repos/{owner}/{repo}/git/commits/{obj_sha}")
                                      source_digest = obj_sha  # Use tag SHA as identifier
                                      print(f"  source digest (annotated tag): {source_digest[:16]}...")
                          except Exception as e:
                              print(f"  Could not get source digest from tag API: {e}")

                  # ── Verify attestation with gh CLI ───────────────────────────────
                  # Policy enforcement:
                  # - Predicate type: slsa.dev/provenance/v1
                  # - Source repo: https://github.com/{owner}/{repo}
                  # - OIDC issuer: token.actions.githubusercontent.com
                  # - Signer workflow: axolotl-pm/pmmp-plugin-actions/.github/workflows/build-phar.yml
                  verify_cmd = [
                      'gh', 'attestation', 'verify',
                      download_url,
                      '--repo', f'{owner}/{repo}',
                      '--signer-workflow', SIGNER_WORKFLOW,
                  ]

                  # Add source digest if available for stricter verification
                  if source_digest:
                      verify_cmd.extend(['--source-digest', f'git-sha:{source_digest}'])

                  print(f"  Running: gh attestation verify ...")
                  verify_result = subprocess.run(
                      verify_cmd,
                      capture_output=True, text=True, timeout=120,
                      env={**os.environ, 'GH_TOKEN': gh_token}
                  )

                  print(f"  verify exit code: {verify_result.returncode}")

                  if verify_result.returncode == 0:
                      build_tier = 'verified'
                      print(f"  build_tier: verified")
                  else:
                      # Verification failed - print debug info
                      print(f"  Verification failed (non-zero exit):")
                      for line in verify_result.stderr.split('\n')[:8]:
                          if line.strip():
                              print(f"    {line}")

              except subprocess.TimeoutExpired:
                  print(f"  attestation check timed out")
              except Exception as e:
                  print(f"  attestation check failed: {e}")

              # ── Fallback: All non-verified builds are unverified ─────────────────
              # Note: github-actions[bot] can be impersonated by anyone, so we
              # don't treat it as a trust signal. Only SLSA attestation matters.
              if build_tier is None:
                  build_tier = 'unverified'
                  print(f"  build_tier: unverified (attestation not verified)")

              # Fetch stargazers count
              try:
                  repo_data = gh_api(f"/repos/{owner}/{repo}")
                  stargazers_count = repo_data.get('stargazers_count', 0)
                  print(f"  stars: {stargazers_count}")
              except:
                  stargazers_count = 0

              # Resolve icon_url
              icon_url = None
              head_base = f"https://raw.githubusercontent.com/{owner}/{repo}/HEAD"

              if icon_path:
                  # Try submitted path
                  try:
                      req = urllib.request.Request(f"{head_base}/{icon_path}", method='HEAD')
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          if resp.status == 200:
                              icon_url = f"{head_base}/{icon_path}"
                  except:
                      pass

              if not icon_url:
                  # Try icon.png
                  try:
                      req = urllib.request.Request(f"{head_base}/icon.png", method='HEAD')
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          if resp.status == 200:
                              icon_url = f"{head_base}/icon.png"
                              icon_path = 'icon.png'
                  except:
                      pass

              if not icon_url:
                  # Try assets/icon.png
                  try:
                      req = urllib.request.Request(f"{head_base}/assets/icon.png", method='HEAD')
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          if resp.status == 200:
                              icon_url = f"{head_base}/assets/icon.png"
                              icon_path = 'assets/icon.png'
                  except:
                      pass

              print(f"  icon: {icon_url or 'default'}")
              print(f"  keywords: {keywords}")

              # Create entry
              now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

              # Check if entry already exists
              existing_idx = None
              for i, entry in enumerate(index):
                  if entry.get('id') == plugin_id:
                      existing_idx = i
                      break

              if existing_idx is not None:
                  # Update existing entry
                  entry = index[existing_idx]
                  entry['tag'] = release_tag
                  entry['version'] = version
                  entry['api'] = api_list
                  entry['author'] = author_list
                  entry['description'] = description
                  entry['download_url'] = download_url
                  entry['download_count'] = download_count
                  entry['download_total'] = download_total
                  entry['stargazers_count'] = stargazers_count
                  entry['icon_path'] = icon_path
                  entry['icon_url'] = icon_url
                  entry['build_tier'] = build_tier
                  entry['attestation_checked_at'] = checked_at
                  entry['last_synced_at'] = now
                  entry['dev_build'] = dev_build  # Update nightly build info if available

                  # Update keywords if provided
                  if keywords:
                      entry['keywords'] = keywords

                  # Add tag to all_tags if not present
                  if release_tag and release_tag not in entry.get('all_tags', []):
                      entry.setdefault('all_tags', []).insert(0, release_tag)

                  print(f"\n  ✓ Updated existing entry: {plugin_id}")
              else:
                  # Create new entry
                  entry = {
                      'id': plugin_id,
                      'name': name,
                      'tag': release_tag,
                      'version': version,
                      'all_tags': [release_tag] if release_tag else [],
                      'dev_build': dev_build,
                      'api': api_list,
                      'author': author_list,
                      'description': description,
                      'category': category,
                      'icon_path': icon_path,
                      'icon_url': icon_url,
                      'repo_url': repo_url,
                      'download_url': download_url,
                      'download_count': download_count,
                      'download_total': download_total,
                      'stargazers_count': stargazers_count,
                      'build_tier': build_tier,
                      'attestation_checked_at': checked_at,
                      'approved_at': now,
                      'last_synced_at': now,
                      'featured': False,
                      'featured_marked_at': None,
                      'submission_pr_number': int(pr_number) if pr_number else None,
                      'keywords': keywords if keywords else [],
                      'fork': fork,
                      'forked_from': forked_from,
                  }
                  index.append(entry)
                  print(f"\n  ✓ Added new entry: {plugin_id}")
                  if fork:
                      print(f"     (forked from: {forked_from})")

              processed_files.append(filepath)

          # Write updated index
          with open(index_path, 'w') as f:
              json.dump(index, f, indent=2)
              f.write('\n')

          print(f"\n{'='*60}")
          print(f"Processed {len(processed_files)} file(s)")
          print(f"Total entries in index: {len(index)}")

          if errors:
              print(f"\nErrors ({len(errors)}):")
              for err in errors:
                  print(f"  - {err}")

          # Write processed files for next step
          with open('/tmp/processed_files.json', 'w') as f:
              json.dump(processed_files, f)

          with open('/tmp/errors.json', 'w') as f:
              json.dump(errors, f)

          if errors:
              print("\n::error::Some submissions had errors")
              exit(1)

          PYEOF

      # ── Commit index changes ──────────────────────────────────────────────
      - name: Commit index changes
        if: steps.get_event.outputs.triggered_by != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/index.json
          git diff --staged --quiet && {
            echo "No changes to index - entry may already exist"
            exit 0
          }

          git commit -m "chore: approve plugin submission

          Approved via PR #${{ steps.get_event.outputs.pr_number }}
          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          git push

          echo "Index updated successfully"

      # ── Delete submission files ───────────────────────────────────────────
      - name: Delete submission files
        if: steps.get_event.outputs.triggered_by != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # Read and display processed files
          python3 << 'EOF'
          import json
          with open('/tmp/processed_files.json') as f:
              files = json.load(f)
          for filepath in files:
              print(f"Deleting: {filepath}")
          print(f"Total: {len(files)} files")
          EOF

          # Get files list for shell loop
          FILES_LIST=$(python3 -c "import json; import sys; print(' '.join(json.load(open('/tmp/processed_files.json'))))")

          # Add deletions to staging
          for file in $FILES_LIST; do
            git rm -f "$file" 2>/dev/null || true
          done

          # Check if there are any changes to commit
          git diff --staged --quiet && {
            echo "No files to delete"
            exit 0
          }

          git commit -m "chore: remove approved submission files

          Files processed and approved
          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          git push

          echo "Submission files deleted"

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Summary
        if: steps.get_event.outputs.triggered_by != 'skip'
        run: |
          echo ""
          echo "========================================"
          echo "Approval Complete"
          echo "========================================"
          echo ""
          echo "PR #${{ steps.get_event.outputs.pr_number }} has been approved."
          echo ""
          echo "The plugin has been added/updated in data/index.json"
          echo "and the submission files have been removed."