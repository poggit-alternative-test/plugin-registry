name: Featured Plugin Monitor

# Prevent concurrent workflow runs to avoid race conditions
concurrency:
  group: featured-monitor-${{ github.repository }}
  cancel-in-progress: false

# Monitors and manages featured plugins.
# Submissions in this registry are PR-based (see validate-pr.yml / approve-pr.yml),
# so featured status is tracked against the submission PR, not an issue.
# - When 'featured' label is added to a submission PR: sets featured: true
# - When 'featured' label is removed: sets featured: false
# - Scheduled: enforces max 10 featured plugins
on:
  pull_request:
    types: [labeled, unlabeled]
  schedule:
    # Every hour at :30
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        type: string

# Permissions
permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Handle label changes ────────────────────────────────────────────────
  handle-label:
    name: Handle featured label
    runs-on: ubuntu-latest
    # Only run when PR is merged (or not a pull_request event)
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    outputs:
      action: ${{ steps.process.outputs.action }}
      plugin_id: ${{ steps.process.outputs.plugin_id }}

    steps:
      # ── Check if it's a featured label change ─────────────────────────
      - name: Check label
        id: check-label
        run: |
          LABEL_NAME="${{ github.event.label.name }}"
          echo "Label changed: $LABEL_NAME"
          echo "Action: ${{ github.event.action }}"

          if [ "$LABEL_NAME" = "featured" ]; then
            echo "is_featured_change=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_featured_change=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Skip if not featured label ────────────────────────────────────
      - name: Skip if not featured
        if: steps.check-label.outputs.is_featured_change != 'true'
        run: exit 0

      # ── Find plugin by submission PR number ─────────────────────────────
      - name: Find plugin
        id: find-plugin
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Find entry with matching submission_pr_number
          RESULT=$(python3 << 'PYEOF'
          import json
          import os

          pr_number = int(os.environ.get('PR_NUMBER', '0'))

          with open('data/index.json') as f:
              index = json.load(f)

          for i, entry in enumerate(index):
              if entry.get('submission_pr_number') == pr_number:
                  print(f"found={entry['id']}")
                  print(f"index={i}")
                  print(f"featured={entry.get('featured', False)}")
                  exit(0)

          print("found=none")
          PYEOF
          )

          echo "$RESULT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"

      # ── Skip if no matching plugin found ───────────────────────────────
      - name: Skip if not found
        if: steps.find-plugin.outputs.found == 'none'
        run: |
          echo "No plugin found with submission_pr_number=${{ github.event.pull_request.number }}"
          echo "This PR may not be linked to an approved plugin entry."
          exit 0

      # ── Update featured status via GitHub API ──────────────────────────
      # Uses SHA-based optimistic locking to prevent race conditions
      # Also checks if plugin is unavailable before setting featured
      - name: Update featured status via GitHub API
        id: process
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Use base branch for PR events, ref_name for schedule/dispatch
          BASE_BRANCH: ${{ github.event_name != 'pull_request' && github.ref_name || github.event.pull_request.base.ref }}
          PLUGIN_ID: ${{ steps.find-plugin.outputs.found }}
          ACTION: ${{ github.event.action }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import base64
          import urllib.request
          import urllib.error
          import time
          from datetime import datetime, timezone

          gh_token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('REPO', '')
          branch = os.environ.get('BASE_BRANCH', 'main')
          plugin_id = os.environ.get('PLUGIN_ID', '')
          action = os.environ.get('ACTION', '')

          MAX_RETRIES = 3

          def gh_request(method, url, data=None):
              """Make GitHub API request"""
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {gh_token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              body = None
              if data is not None:
                  headers['Content-Type'] = 'application/json'
                  body = json.dumps(data).encode()
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  content = resp.read()
                  if resp.status == 204:
                      return None
                  return json.loads(content)

          url = f"https://api.github.com/repos/{repo}/contents/data/index.json"

          for attempt in range(1, MAX_RETRIES + 1):
              print(f"Attempt {attempt}/{MAX_RETRIES}")

              try:
                  # 1. Get current file with SHA (for optimistic locking)
                  current = gh_request('GET', f"{url}?ref={branch}")
                  sha = current['sha']
                  content = base64.b64decode(current['content']).decode()
                  index = json.loads(content)

                  # 2. Find and update entry
                  now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
                  found = False
                  unavailable = False

                  for entry in index:
                      if entry.get('id') == plugin_id:
                          # Check unavailable status
                          unavailable = entry.get('unavailable', False)
                          if unavailable:
                              print(f"⚠ Plugin {plugin_id} is unavailable (unavailable=true)")
                              print(f"   Cannot set featured while plugin is unavailable")
                              exit(0)

                          if action == 'labeled':
                              entry['featured'] = True
                              entry['featured_marked_at'] = now
                              print(f"✓ Set featured=true for {plugin_id}")
                          else:
                              entry['featured'] = False
                              entry['featured_marked_at'] = None
                              print(f"✓ Set featured=false for {plugin_id}")
                          found = True
                          break

                  if not found:
                      print(f"Plugin {plugin_id} not found in index")
                      exit(0)

                  # 3. Write back with SHA validation (optimistic locking)
                  new_content_b64 = base64.b64encode(
                      (json.dumps(index, indent=2) + '\n').encode()
                  ).decode()

                  verb = "mark" if action == "labeled" else "remove"
                  prep = "as" if action == "labeled" else "from"
                  msg = f"feat: {verb} {plugin_id} {prep} featured"

                  gh_request('PUT', url, {
                      'message': msg,
                      'content': new_content_b64,
                      'sha': sha,
                      'branch': branch
                  })

                  print("✓ Successfully updated via GitHub API")
                  print(f"action={action}" >> open(os.environ.get('GITHUB_OUTPUT', '/dev/stdout'), 'a'))
                  exit(0)

              except urllib.error.HTTPError as e:
                  if e.code == 409:  # Conflict - file was modified
                      print("⚠ Conflict detected, retrying...")
                      time.sleep(2 ** attempt)  # Exponential backoff
                      continue
                  elif e.code == 404:
                      print(f"::error::index.json not found in repository")
                      exit(1)
                  else:
                      print(f"::error::HTTP Error: {e.code} - {e.reason}")
                      exit(1)
              except Exception as e:
                  print(f"::error::{type(e).__name__}: {e}")
                  exit(1)

          print("::error::Failed to update after 3 attempts due to conflicts")
          exit(1)
          PYEOF

  # ── Enforce max 10 featured ─────────────────────────────────────────────
  enforce-max:
    name: Enforce max featured
    runs-on: ubuntu-latest
    # Only run on scheduled or manual triggers
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      # ── Enforce max 10 featured via GitHub API ─────────────────────────
      # Uses SHA-based optimistic locking to prevent race conditions
      - name: Enforce max 10 featured
        id: enforce
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import base64
          import urllib.request
          import urllib.error
          import time
          from datetime import datetime, timezone

          gh_token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('REPO', '')
          branch = os.environ.get('BRANCH', 'main')
          MAX_FEATURED = 10

          def gh_request(method, url, data=None):
              """Make GitHub API request"""
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {gh_token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              body = None
              if data is not None:
                  headers['Content-Type'] = 'application/json'
                  body = json.dumps(data).encode()
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  content = resp.read()
                  if resp.status == 204:
                      return None
                  return json.loads(content)

          url = f"https://api.github.com/repos/{repo}/contents/data/index.json"

          MAX_RETRIES = 3
          removed_plugins = []

          for attempt in range(1, MAX_RETRIES + 1):
              print(f"Attempt {attempt}/{MAX_RETRIES}")

              try:
                  # 1. Get current file with SHA (for optimistic locking)
                  current = gh_request('GET', f"{url}?ref={branch}")
                  sha = current['sha']
                  content = base64.b64decode(current['content']).decode()
                  index = json.loads(content)

                  # 2. Find and prepare updates
                  featured = [e for e in index if e.get('featured') == True]
                  print(f"Current featured count: {len(featured)}/{MAX_FEATURED}")

                  if len(featured) <= MAX_FEATURED:
                      print("No action needed - under limit")
                      exit(0)

                  # Sort by featured_marked_at (oldest first), then approved_at, then id
                  # This ensures deterministic ordering even if featured_marked_at is null
                  featured.sort(key=lambda x: (
                      x.get('featured_marked_at') or '',  # Primary: featured_marked_at
                      x.get('approved_at') or '',          # Fallback: approved_at
                      x.get('id', '')                      # Tie-breaker: plugin id
                  ))

                  # Find plugins to unfeature
                  to_remove = featured[MAX_FEATURED:]
                  if not to_remove:
                      print("No plugins to remove from featured")
                      exit(0)

                  print(f"\nPlugins to remove from featured (oldest first):")
                  for p in to_remove:
                      print(f"  - {p['id']} (marked at {p.get('featured_marked_at')})")
                      removed_plugins.append(p['id'])

                  # 3. Update entries in memory
                  now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
                  for entry in index:
                      if entry in to_remove:
                          entry['featured'] = False
                          entry['featured_marked_at'] = None

                  # 4. Write back with SHA validation (optimistic locking)
                  new_content_b64 = base64.b64encode(
                      (json.dumps(index, indent=2) + '\n').encode()
                  ).decode()

                  msg = f"chore: enforce max {MAX_FEATURED} featured plugins"
                  print(f"Removed {len(removed_plugins)} plugin(s) from featured")

                  gh_request('PUT', url, {
                      'message': msg,
                      'content': new_content_b64,
                      'sha': sha,
                      'branch': branch
                  })

                  print("✓ Successfully updated via GitHub API")
                  print(f"removed={json.dumps(removed_plugins)}" >> open(os.environ.get('GITHUB_OUTPUT', '/dev/stdout'), 'a'))
                  exit(0)

              except urllib.error.HTTPError as e:
                  if e.code == 409:  # Conflict - file was modified
                      print("⚠ Conflict detected, retrying...")
                      time.sleep(2 ** attempt)  # Exponential backoff
                      continue
                  elif e.code == 404:
                      print(f"::error::index.json not found in repository")
                      exit(1)
                  else:
                      print(f"::error::HTTP Error: {e.code} - {e.reason}")
                      exit(1)
              except Exception as e:
                  print(f"::error::{type(e).__name__}: {e}")
                  exit(1)

          print("::error::Failed to update after 3 attempts due to conflicts")
          exit(1)
          PYEOF

      # ── Remove labels from PRs ──────────────────────────────────────────
      - name: Remove labels from PRs
        id: remove-labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REMOVED: ${{ steps.enforce.outputs.removed }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import urllib.request
          import urllib.error
          import time

          removed = os.environ.get('REMOVED', '[]')
          repo = os.environ.get('REPO', '')
          gh_token = os.environ.get('GH_TOKEN', '')

          if not removed or removed == '[]':
              print("No plugins to unfeature")
              exit(0)

          removed = json.loads(removed)
          print(f"Removing 'featured' label from {len(removed)} PR(s)...")

          # Get current index to find PR numbers
          def gh_request(method, url, data=None, retries=3):
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {gh_token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              body = None
              if data is not None:
                  headers['Content-Type'] = 'application/json'
                  body = json.dumps(data).encode()

              for attempt in range(1, retries + 1):
                  try:
                      req = urllib.request.Request(url, data=body, headers=headers, method=method)
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          content = resp.read()
                          if resp.status == 204:
                              return None
                          return json.loads(content)
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return None
                      if attempt < retries:
                          print(f"    Retry {attempt}/{retries}...")
                          time.sleep(2 ** attempt)  # Exponential backoff
                          continue
                      raise

          # Get current index
          import base64
          url = f"https://api.github.com/repos/{repo}/contents/data/index.json"
          current = gh_request('GET', f"{url}?ref={os.environ.get('BRANCH', 'main')}")
          if not current:
              print("Could not fetch index.json")
              exit(1)

          index = json.loads(base64.b64decode(current['content']).decode())

          for plugin_id in removed:
              for entry in index:
                  if entry.get('id') == plugin_id:
                      pr_num = entry.get('submission_pr_number')
                      if pr_num:
                          print(f"  Removing label from PR #{pr_num} ({plugin_id})")
                          label_url = f"https://api.github.com/repos/{repo}/issues/{pr_num}/labels/featured"
                          result = gh_request('DELETE', label_url, retries=3)
                          if result is None:
                              print(f"    ✓ Label removed (or already absent)")
                          else:
                              print(f"    ✓ Response: {result}")
          PYEOF
