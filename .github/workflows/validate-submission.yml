          [**axolotl-pm/pmmp-plugin-actions**](https://github.com/axolotl-pm/pmmp-plugin-actions).

          ---
          "
                      fi
                      COMMENT_BODY="${COMMENT_BODY}\\
          Please address the failed checks above and re-open/edit this issue to
          trigger a re-validation.
          "
                    else
                      COMMENT_BODY="${COMMENT_BODY}\\
          All automated checks passed. A maintainer will review this submission shortly.
          "
                    fi

                    COMMENT_BODY="${COMMENT_BODY}\\
          <!-- axolotl-validation:end -->"

                    # Escape the comment body for safe use in heredoc.
                    COMMENT_ESCAPED=$(echo "$COMMENT_BODY" | python3 -c "
          import sys, json
          print(json.dumps(sys.stdin.read()))" 2>/dev/null)

          # Look for an existing comment from this workflow.
          EXISTING=$(gh api "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("axolotl-validation:start"))) | .id' \
            2>/dev/null | head -1 || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Updating existing validation comment (ID: $EXISTING)"
            gh api --method PATCH \
              "repos/${OWNER}/${REPO}/issues/comments/${EXISTING}" \
              --field body="$COMMENT_BODY" > /dev/null
          else
            echo "Posting new validation comment"
            gh api --method POST \
              "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/comments" \
              --field body="$COMMENT_BODY" > /dev/null
          fi
