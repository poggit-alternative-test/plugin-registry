name: Sync Plugin Index

# Keeps all approved plugin entries fresh without requiring resubmission.
#
# - Refreshes: download_count, download_total, icon_path, icon_url,
#   stargazers_count, unavailable, last_synced_at
# - Re-resolves icon_url per three-tier fallback (may change if the submitter
#   uploaded assets/ after approval): submitted icon_path → icon.png →
#   assets/icon.png → null (frontend uses default)
# - Marks entries unavailable if their repo or latest release becomes inaccessible
# - Commits only when something actually changed
# - NEVER modifies: tag, version, download_url, build_tier, attestation_checked_at,
#   all_tags, dev_build (these reflect state at approval time)
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full sync even if nothing has changed'
        required: false
        default: false
        type: boolean

  # Every 6 hours. Pick an off-minute mark to spread load across the fleet.
  schedule:
    - cron: '17 */6 * * *'

# Read-only for schedule runs; write permission granted only in the commit job.
permissions:
  contents: read

jobs:
  # ── Phase 1: fetch fresh data for all entries ─────────────────────────────
  refresh:
    name: Refresh plugin data
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check-changed.outputs.changed }}
      entry_count: ${{ steps.check-changed.outputs.entry_count }}
      unavailable: ${{ steps.check-changed.outputs.unavailable }}

    steps:
      - name: Checkout registry repo
        uses: actions/checkout@v4

      # ── Load index.json ──────────────────────────────────────────────────
      - name: Load index
        id: load
        run: |
          if [ ! -f data/index.json ]; then
            echo "No data/index.json found — nothing to sync."
            echo '{"entries": [], "changed": false}' > /tmp/sync_result.json
            exit 0
          fi
          python3 -c "
          import json
          with open('data/index.json') as f:
              data = json.load(f)
          print(len(data), 'entries')
          with open('/tmp/sync_index_input.json', 'w') as f:
              json.dump(data, f)
          "

      # ── Refresh all plugin entries (Python) ────────────────────────────
      # Writes results to /tmp/sync_result.json — avoid using GITHUB_OUTPUT
      # inside Python to keep stdout clean.
      - name: Refresh all plugin entries
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, time, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor, as_completed

          FORCE = os.environ.get('FORCE', 'false').lower() == 'true'

          def gh_api_json(path):
              """GET a GitHub REST API endpoint, return (status_code, body_dict)."""
              token = os.environ.get('GITHUB_TOKEN', '')
              url = f'https://api.github.com{path}'
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  return e.code, None

          def raw_head_exists(url):
              """Check if a raw URL returns 200 using HEAD request."""
              try:
                  req = urllib.request.Request(url, method='HEAD')
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      return resp.status == 200
              except Exception:
                  return False

          def resolve_icon_url(owner, repo, current_icon_path):
              """
              Three-tier icon resolution:
              1. explicitly submitted icon_path (may have been updated since approval)
              2. icon.png (common convention — checked first)
              3. assets/icon.png convention (checked second)
              4. null (frontend uses default)

              Uses /HEAD/ — GitHub resolves this server-side; no API call needed
              to determine the default branch.
              """
              head_base = f'https://raw.githubusercontent.com/{owner}/{repo}/HEAD'

              # Tier 1: submitted icon_path
              if current_icon_path and raw_head_exists(f'{head_base}/{current_icon_path}'):
                  return current_icon_path, f'{head_base}/{current_icon_path}'

              # Tier 2a: icon.png (first fallback)
              if raw_head_exists(f'{head_base}/icon.png'):
                  return 'icon.png', f'{head_base}/icon.png'

              # Tier 2b: assets/icon.png (second fallback)
              if raw_head_exists(f'{head_base}/assets/icon.png'):
                  return 'assets/icon.png', f'{head_base}/assets/icon.png'

              # Tier 3: null
              return None, None

          def refresh_entry(entry):
              """Refresh a single entry. Returns updated (entry, did_change, reason).

              - download_count: updated for current approved version
              - download_total: updated as cumulative sum across all stable releases
              - icon_path, icon_url: re-resolved per tier fallback
              - stargazers_count: updated from GitHub API
              - unavailable, last_synced_at: updated on every sync
              - tag, version, download_url, build_tier, attestation_checked_at,
                all_tags, dev_build: NOT updated (reflect approval time)
              """
              plugin_id = entry.get('id', '')
              if '/' not in plugin_id:
                  return entry, False, 'invalid_id'

              owner, repo = plugin_id.split('/', 1)

              # ── Fetch /repos/{owner}/{repo} for stargazers_count ────────────
              _, repo_data = gh_api_json(f'/repos/{owner}/{repo}')
              new_stars = repo_data.get('stargazers_count', 0) if repo_data else 0

              # ── Fetch /releases/latest (stable release) ────────────────────
              status, release = gh_api_json(f'/repos/{owner}/{repo}/releases/latest')

              if status == 404:
                  entry['unavailable'] = True
                  entry['last_synced_at'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
                  return entry, True, 'repo_private_or_no_release'

              if status >= 400:
                  entry['unavailable'] = True
                  entry['last_synced_at'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
                  return entry, True, f'api_error_{status}'

              # ── Find .phar asset in stable release ───────────────────────
              phar_asset = next(
                  (a for a in release.get('assets', []) if a['name'].lower().endswith('.phar')),
                  None
              )

              if not phar_asset:
                  entry['unavailable'] = True
                  entry['last_synced_at'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
                  return entry, True, 'release_has_no_phar'

              # NOTE: tag, version, download_url intentionally not stored
              # These reflect the version that was approved — new versions require new submissions.
              new_download_count = phar_asset.get('download_count', 0)
              phar_url = phar_asset['browser_download_url']

              # ── Fetch all releases for download_total ───────────────────────
              # Sum downloads across all stable releases (non-prerelease)
              # We use /releases (not /releases/latest) to get ALL releases
              _, all_releases = gh_api_json(f'/repos/{owner}/{repo}/releases')
              new_download_total = 0
              if all_releases:
                  for rel in all_releases:
                      # Only count stable (non-prerelease) releases
                      if not rel.get('prerelease', False):
                          for asset in rel.get('assets', []):
                              if asset['name'].lower().endswith('.phar'):
                                  new_download_total += asset.get('download_count', 0)
                                  break  # only count .phar per release

              # ── Determine build_tier (stable only) ─────────────────────
              # NOTE: build_tier is intentionally NOT updated during sync.
              # It reflects the state at approval time — re-verification requires new submission.
              # This block is kept for reference only; no changes are persisted.

              # (build_tier logic omitted — not updated during sync)

              # ── Re-resolve icon_url ───────────────────────────────────
              new_icon_path, new_icon_url = resolve_icon_url(
                  owner, repo, entry.get('icon_path'))

              # ── Detect changes ─────────────────────────────────────────
              # Tracked fields: download_count, download_total, icon_url, stargazers_count, unavailable
              # NOT tracked (intentionally unchanged): tag, version, download_url,
              #   build_tier, attestation_checked_at, all_tags, dev_build
              did_change = (
                  entry.get('download_count') != new_download_count
                  or entry.get('download_total') != new_download_total
                  or entry.get('icon_url') != new_icon_url
                  or entry.get('stargazers_count') != new_stars
                  or entry.get('unavailable', False) is True  # was previously unavailable
              )

              entry['download_count'] = new_download_count
              entry['download_total'] = new_download_total
              entry['icon_path'] = new_icon_path
              entry['icon_url'] = new_icon_url
              entry['stargazers_count'] = new_stars
              entry['unavailable'] = False
              entry['last_synced_at'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
              # NOTE: tag, version, download_url, build_tier, attestation_checked_at,
              #       all_tags, dev_build intentionally NOT modified

              # Ensure fields exist (for older entries)
              if 'all_tags' not in entry:
                  entry['all_tags'] = []
              if 'dev_build' not in entry:
                  entry['dev_build'] = None
              if 'featured' not in entry:
                  entry['featured'] = False
              if 'featured_marked_at' not in entry:
                  entry['featured_marked_at'] = None
              if 'submission_pr_number' not in entry:
                  entry['submission_pr_number'] = None
              if 'keywords' not in entry:
                  entry['keywords'] = []
              if 'download_total' not in entry:
                  # For older entries without download_total, initialize with download_count
                  entry['download_total'] = entry.get('download_count', 0)

              return entry, did_change, 'updated' if did_change else 'unchanged'

          # ── Main sync loop ──────────────────────────────────────────────
          with open('/tmp/sync_index_input.json') as f:
              index = json.load(f)

          print(f'Loaded {len(index)} entries, starting refresh...')

          refreshed = []
          changed_flags = []
          with ThreadPoolExecutor(max_workers=8) as executor:
              futures = {executor.submit(refresh_entry, e): e for e in index}
              for i, future in enumerate(as_completed(futures)):
                  plugin_id = futures[future].get('id', '?')
                  try:
                      entry, changed, reason = future.result()
                      refreshed.append(entry)
                      changed_flags.append(changed)
                      print(f'  [{i+1}/{len(index)}] {plugin_id}: {reason}')
                  except Exception as exc:
                      print(f'  [{i+1}/{len(index)}] {plugin_id}: ERROR — {exc}', file=__import__('sys').stderr)
                      entry = futures[future]
                      entry['unavailable'] = True
                      entry['last_synced_at'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
                      refreshed.append(entry)
                      changed_flags.append(True)  # treat unexpected errors as a change worth persisting

          any_changed = FORCE or any(changed_flags)

          unavailable = [e['id'] for e in refreshed if e.get('unavailable')]
          print(f'Sync complete — {len(refreshed)} entries, changed={any_changed}, unavailable={len(unavailable)}')

          # Write results to a file (not GITHUB_OUTPUT) to keep stdout clean.
          result = {
              'entries': refreshed,
              'changed': any_changed,
              'unavailable': unavailable,
          }
          with open('/tmp/sync_result.json', 'w') as f:
              json.dump(result, f)

          PYEOF

      # ── Read results and set job outputs ─────────────────────────────────
      # These outputs are only consumed if changed=true (write job).
      - name: Read sync results
        id: check-changed
        run: |
          python3 -c "
          import json, os

          with open('/tmp/sync_result.json') as f:
              result = json.load(f)
          changed = result['changed']
          entries = result['entries']
          unavailable = result['unavailable']

          # Persist the refreshed index for the commit job.
          with open('data/index.json', 'w') as f:
              json.dump(entries, f, indent=2)
              f.write('\n')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'changed={str(changed).lower()}\n')
              f.write(f'entry_count={len(entries)}\n')
              f.write(f'unavailable={json.dumps(unavailable)}\n')

          print(f'changed={str(changed).lower()} entry_count={len(entries)} unavailable={len(unavailable)}')
          print('data/index.json updated')
          "

      # ── Upload refreshed index as artifact for the commit job ─────────────
      # Files written to the workspace are lost between jobs (different runners).
      # Using artifact ensures the commit job receives the updated index.json.
      - name: Upload refreshed index
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-index
          path: data/index.json
          retention-days: 1

  # ── Phase 2: commit if anything changed ────────────────────────────────────
  commit:
    name: Commit updated index
    needs: refresh
    # Only grant write permission in this job.
    permissions:
      contents: write
    # Skip if nothing changed or index was empty.
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      # Need full checkout to have .git directory for git commands.
      - name: Checkout registry repo
        uses: actions/checkout@v4

      # Download the refreshed index from the refresh job (artifact persists
      # between jobs). Overwrite the checked-out index.json with the updated one.
      - name: Download refreshed index
        uses: actions/download-artifact@v4
        with:
          name: refreshed-index
          path: data/

      - name: Verify index file
        run: |
          if [ ! -f data/index.json ]; then
            echo "data/index.json missing — cannot commit"
            exit 1
          fi
          echo "Entries: $(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' < data/index.json)"

      - name: Commit and push
        env:
          ENTRY_COUNT: ${{ needs.refresh.outputs.entry_count }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/index.json
          git diff --staged --quiet && {
            echo "Nothing to commit — index unchanged."
            exit 0
          }

          git commit -m "chore: sync plugin index ($ENTRY_COUNT entries)

          Updated by sync-index workflow.
          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          git push
          echo "Committed and pushed sync changes."

      - name: Report unavailable plugins
        if: needs.refresh.outputs.unavailable != '[]'
        run: |
          echo "The following plugins were marked unavailable:"
          python3 -c "import json; [print(f'  - {id}') for id in json.loads('''${{ needs.refresh.outputs.unavailable }}''')]"