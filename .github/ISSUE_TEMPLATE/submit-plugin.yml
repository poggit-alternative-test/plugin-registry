name: Submit a Plugin
description: Submit a PocketMine-MP plugin to the Axolotl registry.
title: "[Plugin] "
labels:
  - pending
body:
  - type: markdown
    attributes:
      value: |
        ## Plugin Submission

        For developers without CI, submit via the registry site instead.

  - type: textarea
    id: submission
    attributes:
      label: Submission Data
      description: >
        Enter your plugin info in this format (copy and fill):

        repository_url: https://github.com/username/plugin-name
        category: admin
        icon_path: assets/icon.png

        Leave icon_path blank if not needed.
      placeholder: |
        repository_url: https://github.com/username/plugin-name
        category: admin
        icon_path:
    validations:
      required: true
